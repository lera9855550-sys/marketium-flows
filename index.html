<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketium · флоу та екрани</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Exo+2:wght@400;500;600&display=swap">
<style>
:root{
 --bg:#0E0F12;--side:#141519;--panel:#1A1C21;--line:#26282F;--line2:#33363F;
 --text:#F2F3F5;--muted:#8D92A0;--dim:#5E6370;--accent:#1B67F5;--accent2:#4C8DFF;
 --w:300px;--r:28px;--side-w:300px;--bar:60px;
 --ui:"Exo 2",system-ui,-apple-system,sans-serif;--display:"Unbounded",var(--ui);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--muted)}
/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(14,15,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:50}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.sp{flex:1}
.seg{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--line2);color:var(--text)}
.burger{display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center}
/* sidebar */
.side{position:fixed;top:var(--bar);bottom:0;left:0;width:var(--side-w);overflow-y:auto;padding:18px 10px 60px;background:var(--side);border-right:1px solid var(--line);z-index:40;scrollbar-width:thin}
.sec{margin-bottom:6px}
.sec>button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;font-size:17px;font-weight:500;text-align:left}
.sec>button:hover{background:var(--panel)}
.sec>button svg{width:12px;height:12px;color:var(--muted);transition:transform .15s;flex:none}
.sec.closed>button svg{transform:rotate(-90deg)}
.sec .n{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.sec ul{list-style:none;margin:2px 0 8px;padding:0}
.sec.closed ul{display:none}
.sec li a{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 32px;border-radius:9px;font-size:15px;color:var(--muted)}
.sec li a:hover{background:var(--panel);color:var(--text)}
.sec li a.on{color:var(--text);background:var(--panel)}
.sec li a.on::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent2);margin-left:-14px;margin-right:0}
.sec li a .n{margin-left:auto;font-size:12px;color:var(--dim)}
/* main */
main{margin-left:var(--side-w);padding:calc(var(--bar) + 28px) 0 120px}
.sechead{padding:22px 40px 6px;display:flex;align-items:baseline;gap:12px}
.sechead h2{margin:0;font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.01em}
.sechead span{color:var(--muted);font-size:14px}
.flow{padding:18px 0 34px;scroll-margin-top:calc(var(--bar) + 10px)}
.rowwrap{position:relative}
.row{display:flex;gap:22px;overflow-x:auto;padding:6px 40px 14px;scroll-snap-type:x proximity;scroll-padding:40px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.shot{flex:none;width:var(--w);scroll-snap-align:start;cursor:zoom-in}
.shot .im{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:1080/2348;box-shadow:0 0 0 1px var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.shot:hover img{transform:scale(1.015)}
.shot .cap{padding:12px 4px 0}
.shot .cap b{display:block;font-size:15px;font-weight:600}
.shot .cap span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.shot .pinc{position:absolute;top:10px;right:10px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:none;align-items:center;justify-content:center}
.shot .pinc.on{display:flex}
.arrow{position:absolute;top:calc(var(--w) * 1.087 - 26px);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.88);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:5;opacity:0;transition:opacity .15s}
.rowwrap:hover .arrow{opacity:1}
.arrow.l{left:18px}.arrow.r{right:18px}
.arrow[hidden]{display:none}
.flowcap{padding:4px 40px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.flowcap h3{margin:0;font-family:var(--display);font-weight:500;font-size:20px}
.flowcap span{color:var(--muted);font-size:15px}
.flowcap button{margin-left:auto;font-size:13px;color:var(--muted);padding:6px 12px;border:1px solid var(--line2);border-radius:18px}
.flowcap button:hover{color:var(--text);border-color:var(--muted)}
.empty{padding:60px 40px;color:var(--muted)}
/* canvas mode */
body.canvas main{position:fixed;inset:var(--bar) 0 0 var(--side-w);margin:0;padding:0;overflow:hidden;cursor:grab;touch-action:none}
body.canvas main.drag{cursor:grabbing}
body.canvas #board{transform-origin:0 0;padding:40px;width:max-content;display:flex;gap:160px;align-items:flex-start}
body.canvas .secgrp{flex:none}
body.canvas .sechead h2{font-size:48px}body.canvas .flowcap h3{font-size:28px}
body.canvas .row{overflow:visible;scroll-snap-type:none}
body.canvas .arrow{display:none}
body:not(.canvas) #board{transform:none!important}
.zoomhud{position:fixed;right:18px;bottom:18px;display:none;gap:4px;align-items:center;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;z-index:45}
body.canvas .zoomhud{display:flex}
.zoomhud button{height:32px;min-width:32px;padding:0 10px;border-radius:8px;font-size:14px}
.zoomhud button:hover{background:var(--line2)}
.zoomhud output{min-width:52px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.canvashint{position:fixed;left:calc(var(--side-w) + 18px);bottom:18px;font-size:12px;color:var(--dim);display:none;z-index:45}
body.canvas .canvashint{display:block}
/* viewer */
.viewer{position:fixed;inset:0;background:#07080A;z-index:100;display:none;grid-template-rows:56px 1fr 128px}
.viewer.on{display:grid}
.vtop{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.vtop .t b{font-size:16px}
.vtop .t span{color:var(--muted);font-size:13px;margin-left:10px}
.vtop .t code{color:var(--dim);font-size:12px;margin-left:10px}
.vbtn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
.vbtn:hover{background:var(--panel)}
.vbtn.on{background:var(--accent);border-color:var(--accent)}
.vstage{position:relative;overflow:hidden;cursor:grab;touch-action:none}
.vstage.drag{cursor:grabbing}
.vstage.pinmode{cursor:crosshair}
.vimg{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.vimg img{display:block;height:100%;width:100%;border-radius:36px;box-shadow:0 20px 80px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:flex;align-items:center;justify-content:center;z-index:3}
.vnav.l{left:18px}.vnav.r{right:18px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.strip button{flex:none;height:100px;aspect-ratio:1080/2348;border-radius:10px;overflow:hidden;opacity:.5;outline:2px solid transparent;outline-offset:2px}
.strip button.on{opacity:1;outline-color:var(--accent2)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -2px;border-radius:13px 13px 13px 2px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none}
.pin.tmp{background:#F8C294;color:#111}
.pop{position:absolute;width:320px;padding:12px;background:#fff;color:#111;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10}
.pop textarea{width:100%;min-height:84px;resize:vertical;border:1px solid #ddd;border-radius:10px;padding:9px;font:inherit;font-size:14px}
.pop .r{display:flex;gap:8px;margin-top:8px}
.pop input{flex:1;border:1px solid #ddd;border-radius:10px;padding:8px;font:inherit;font-size:14px}
.pop .go{background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
.pop .k{font-size:11px;color:#888;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;z-index:200;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){
 :root{--side-w:0px;--w:220px}
 .side{width:280px;transform:translateX(-100%);transition:transform .2s}
 body.menu .side{transform:none}
 .burger{display:flex}
 .brand span,.hidem{display:none}
 .row{padding:6px 16px 14px;gap:14px}.flowcap,.sechead{padding-left:16px;padding-right:16px}
 .arrow{display:none}
}
</style>
</head>

 <button class="burger" id="burger" aria-label="Меню"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg></button>

 <div class="strip" id="strip"></div>
</div>

<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const FORM={action:"https://docs.google.com/forms/d/e/1FAIpQLSdb6rr0YpRbBvo61Z0i27g1ji4stae7m83E0QHX2GvXupme4A/formResponse",
 fields:{flow:"entry.1912946041",screen:"entry.663859537",name:"entry.201122895",text:"entry.808053430",page:"entry.1596894630"}};
const all=[];DATA.forEach(sec=>sec.flows.forEach(f=>f.screens.forEach(s=>all.push({route:s[0],label:s[1],note:s[2],flow:f,sec}))));
const plural=n=>{const a=n%10,b=n%100;return a===1&&b!==11?'екран':(a>=2&&a<=4&&!(b>=12&&b<=14)?'екрани':'екранів')};
$('#meta').textContent=all.length+' '+plural(all.length)+' · '+DATA.reduce((n,s)=>n+s.flows.length,0)+' флоу';
function loadPins(){try{return JSON.parse(localStorage.getItem('mk.pins')||'[]')}catch(e){return[]}}
function savePin(p){try{const a=loadPins();a.push(p);localStorage.setItem('mk.pins',JSON.stringify(a.slice(-300)))}catch(e){}}
/* ---- render ---- */
function render(){
 const q=$('#q').value.trim().toLowerCase();
 const hit=s=>!q||(s.route+' '+s.label+' '+s.note+' '+s.flow.title+' '+s.sec.title).toLowerCase().includes(q);
 let side='',board='';
 DATA.forEach(sec=>{
  const flows=sec.flows.map(f=>({f,items:f.screens.map(s=>all.find(a=>a.route===s[0])).filter(hit)})).filter(x=>x.items.length);
  if(!flows.length)return;
  const cnt=flows.reduce((n,x)=>n+x.items.length,0);
  side+=`<div class="sec" data-sec="${sec.id}"><button><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>${sec.title}<span class="n">${cnt}</span></button><ul>`+
   flows.map(x=>`<li><a href="#${x.f.id}" data-flow="${x.f.id}">${x.f.title}<span class="n">${x.items.length}</span></a></li>`).join('')+`</ul></div>`;
  board+=`<div class="secgrp"><div class="sechead" id="${sec.id}"><h2>${sec.title}</h2><span>${cnt} ${plural(cnt)}</span></div>`;
  flows.forEach(x=>{
   board+=`<section class="flow" id="${x.f.id}"><div class="rowwrap"><button class="arrow l" aria-label="Назад">←</button><div class="row">`+
    x.items.map(s=>`<figure class="shot" data-route="${s.route}"><div class="im"><img src="shots/${s.route}.jpg?v=2609220726" alt="${s.label}" loading="lazy" draggable="false"><i class="pinc"></i></div><figcaption class="cap"><b>${s.label}</b><span>${s.note}</span></figcaption></figure>`).join('')+
    `</div><button class="arrow r" aria-label="Далі">→</button></div><div class="flowcap"><h3>${x.f.title}</h3><span>${x.items.length} ${plural(x.items.length)}</span><button data-cflow="${x.f.id}">Коментувати флоу</button></div></section>`;
  });
  board+=`</div>`;
 });
 $('#side').innerHTML=side||'';
 $('#board').innerHTML=board||'<div class="empty">Нічого не знайдено</div>';
 wire();pinCounts();
}
function wire(){
 document.querySelectorAll('.sec>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('closed'));
 document.querySelectorAll('.side a').forEach(a=>a.onclick=e=>{e.preventDefault();document.body.classList.remove('menu');goFlow(a.dataset.flow)});
 document.querySelectorAll('.rowwrap').forEach(w=>{const row=w.querySelector('.row'),l=w.querySelector('.arrow.l'),r=w.querySelector('.arrow.r');
  const upd=()=>{l.hidden=row.scrollLeft<8;r.hidden=row.scrollLeft+row.clientWidth>=row.scrollWidth-8};
  row.addEventListener('scroll',upd,{passive:true});setTimeout(upd,50);
  l.onclick=()=>row.scrollBy({left:-row.clientWidth*.8,behavior:'smooth'});r.onclick=()=>row.scrollBy({left:row.clientWidth*.8,behavior:'smooth'});});
 document.querySelectorAll('.shot').forEach(s=>{s.addEventListener('click',e=>{if(document.body.classList.contains('canvas'))return;openViewer(s.dataset.route)});
  s.addEventListener('dblclick',()=>{if(document.body.classList.contains('canvas'))openViewer(s.dataset.route)})});
 document.querySelectorAll('[data-cflow]').forEach(b=>b.onclick=e=>{e.stopPropagation();flowComment(b)});
 spy();
}
function goFlow(id){const el=document.getElementById(id);if(!el)return;
 if(document.body.classList.contains('canvas')){const r=el.getBoundingClientRect(),m=$('#main').getBoundingClientRect();cam.x-=(r.left-m.left-30);cam.y-=(r.top-m.top-30);applyCam();}
 else el.scrollIntoView({behavior:'smooth',block:'start'});
 history.replaceState(null,'','#'+id);mark(id);}
function mark(id){document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.flow===id))}
let io;function spy(){io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)mark(e.target.id)})},{rootMargin:'-45% 0px -50% 0px'});
 document.querySelectorAll('.flow').forEach(f=>io.observe(f));}
function pinCounts(){const p=loadPins();document.querySelectorAll('.shot').forEach(s=>{const n=p.filter(x=>x.route===s.dataset.route).length,i=s.querySelector('.pinc');i.textContent=n;i.classList.toggle('on',n>0)})}
/* ---- sizes ---- */
function setW(w){document.documentElement.style.setProperty('--w',w+'px');document.querySelectorAll('#sizes button').forEach(b=>b.classList.toggle('on',+b.dataset.w===w));try{localStorage.setItem('mk.w',w)}catch(e){}}
document.querySelectorAll('#sizes button').forEach(b=>b.onclick=()=>setW(+b.dataset.w));
let w0=300;try{w0=+localStorage.getItem('mk.w')||300}catch(e){}setW(innerWidth<900?220:w0);
/* ---- canvas mode (Figma-like) ---- */
const cam={x:0,y:0,z:.5};
function applyCam(){$('#board').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;$('#zval').textContent=Math.round(cam.z*100)+'%'}
function zoomAt(f,cx,cy){const nz=Math.min(3,Math.max(.08,cam.z*f));const k=nz/cam.z;cam.x=cx-(cx-cam.x)*k;cam.y=cy-(cy-cam.y)*k;cam.z=nz;applyCam()}
function fit(){const b=$('#board'),m=$('#main');const W=b.scrollWidth,H=b.scrollHeight;cam.z=Math.min(1,Math.max(.08,Math.min(m.clientWidth/W,m.clientHeight/H)*.96));cam.x=(m.clientWidth-W*cam.z)/2;cam.y=10;applyCam()}
function setMode(m){document.body.classList.toggle('canvas',m==='canvas');document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 if(m==='canvas'){cam.z=.45;cam.x=20;cam.y=10;applyCam()}try{localStorage.setItem('mk.mode',m)}catch(e){}}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const main=$('#main');let drag=null;
main.addEventListener('wheel',e=>{if(!document.body.classList.contains('canvas'))return;e.preventDefault();const r=main.getBoundingClientRect();
 if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top);else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam()}},{passive:false});
main.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('canvas'))return;drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};main.setPointerCapture(e.pointerId);main.classList.add('drag')});
main.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;cam.x=drag.cx+dx;cam.y=drag.cy+dy;applyCam()});
main.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;main.classList.remove('drag');
 if(!moved){const s=document.elementFromPoint(e.clientX,e.clientY)?.closest('.shot');if(s)openViewer(s.dataset.route)}});
$('#zin').onclick=()=>zoomAt(1.25,main.clientWidth/2,main.clientHeight/2);
$('#zout').onclick=()=>zoomAt(.8,main.clientWidth/2,main.clientHeight/2);
$('#zfit').onclick=fit;
/* ---- viewer with zoom/pan ---- */
const V={i:-1,z:1,x:0,y:0,fitz:1,pin:false};const vs=$('#vstage'),vimg=$('#vimg'),vi=$('#vi');
const IW=1080,IH=2348;
function vApply(){vimg.style.width=IW+'px';vimg.style.height=IH+'px';vimg.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`;
 const k=1/V.z;vimg.querySelectorAll('.pin').forEach(p=>p.style.transform=`scale(${k})`);vimg.querySelectorAll('.pop').forEach(p=>p.style.transform=`translate(14px,-10px) scale(${k})`)}
function vFit(){const W=vs.clientWidth,H=vs.clientHeight;V.fitz=Math.min(W/IW,(H-40)/IH);V.z=V.fitz;V.x=(W-IW*V.z)/2;V.y=(H-IH*V.z)/2;vApply()}
function v100(){const W=vs.clientWidth,H=vs.clientHeight;const cx=W/2,cy=H/2;vZoomAt(1/V.z*.5,cx,cy)}
function vZoomAt(f,cx,cy){const nz=Math.min(3,Math.max(V.fitz*.5,V.z*f));const k=nz/V.z;V.x=cx-(cx-V.x)*k;V.y=cy-(cy-V.y)*k;V.z=nz;vApply()}
function openViewer(route){const k=all.findIndex(a=>a.route===route);if(k<0)return;V.i=k;$('#viewer').classList.add('on');document.body.style.overflow='hidden';showV();}
function showV(){const s=all[V.i];vi.src='shots/'+s.route+'.jpg?v=2609220726';
 $('#vt').innerHTML=`<b>${s.label}</b><span>${s.flow.title} · ${s.note}</span><code>${s.route}</code>`;
 const fl=all.filter(a=>a.flow===s.flow);$('#strip').innerHTML=fl.map(a=>`<button data-r="${a.route}" class="${a===s?'on':''}" title="${a.label}"><img src="shots/${a.route}.jpg?v=2609220726" loading="lazy" alt=""></button>`).join('');
 $('#strip').querySelectorAll('button').forEach(b=>b.onclick=()=>openViewer(b.dataset.r));
 $('#strip .on')?.scrollIntoView({inline:'center',block:'nearest'});
 vimg.querySelectorAll('.pin,.pop').forEach(n=>n.remove());
 loadPins().filter(p=>p.route===s.route).forEach((p,n)=>addPin(p.x,p.y,'',n+1));
 history.replaceState(null,'','#'+s.route);vFit();}
function closeV(){$('#viewer').classList.remove('on');document.body.style.overflow='';history.replaceState(null,'','#'+all[V.i].flow.id)}
$('#vx').onclick=closeV;$('#vfit').onclick=vFit;$('#v100').onclick=v100;
$('#vprev').onclick=()=>{if(V.i>0){V.i--;showV()}};$('#vnext').onclick=()=>{if(V.i<all.length-1){V.i++;showV()}};
$('#vpin').onclick=()=>{V.pin=!V.pin;$('#vpin').classList.toggle('on',V.pin);vs.classList.toggle('pinmode',V.pin)};
vs.addEventListener('wheel',e=>{e.preventDefault();const r=vs.getBoundingClientRect();
 if(e.ctrlKey||e.metaKey)vZoomAt(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top);
 else if(V.z>V.fitz*1.01){V.x-=e.deltaX;V.y-=e.deltaY;vApply()}
 else vZoomAt(Math.exp(-e.deltaY*.004),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let vd=null;
vs.addEventListener('pointerdown',e=>{if(e.target.closest('.vnav,.pop'))return;vd={x:e.clientX,y:e.clientY,ox:V.x,oy:V.y,moved:false};vs.setPointerCapture(e.pointerId)});
vs.addEventListener('pointermove',e=>{if(!vd)return;const dx=e.clientX-vd.x,dy=e.clientY-vd.y;if(Math.abs(dx)+Math.abs(dy)>3){vd.moved=true;vs.classList.add('drag')}if(vd.moved&&!V.pin){V.x=vd.ox+dx;V.y=vd.oy+dy;vApply()}});
vs.addEventListener('pointerup',e=>{if(!vd)return;const moved=vd.moved;vd=null;vs.classList.remove('drag');
 if(!moved&&V.pin){const r=vi.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)placePop((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)}});
vs.addEventListener('dblclick',e=>{if(V.pin)return;const r=vs.getBoundingClientRect();if(V.z>V.fitz*1.05)vFit();else vZoomAt(2.4,e.clientX-r.left,e.clientY-r.top)});
addEventListener('resize',()=>{if($('#viewer').classList.contains('on'))vFit()});
/* pinch (Safari gesture) */
vs.addEventListener('gesturestart',e=>e.preventDefault());
function addPin(x,y,cls,n){const p=document.createElement('div');p.className='pin '+(cls||'');p.style.left=x+'%';p.style.top=y+'%';p.style.transform=`scale(${1/Math.max(V.z,.2)})`;p.style.transformOrigin='0 100%';if(n)p.textContent=n;vimg.appendChild(p);return p}
function placePop(x,y){vimg.querySelectorAll('.pin.tmp,.pop').forEach(n=>n.remove());addPin(x,y,'tmp');
 const s=all[V.i];const pop=document.createElement('div');pop.className='pop';
 pop.innerHTML='<textarea placeholder="Що тут не так або що варто змінити?"></textarea><div class="r"><input placeholder="Ваше імʼя"><button class="go">Надіслати</button></div><div class="k"><kbd>⌘</kbd>+<kbd>Enter</kbd> надіслати · <kbd>Esc</kbd> скасувати</div>';
 const sc=1/V.z;pop.style.left=x+'%';pop.style.top=y+'%';pop.style.transform=`translate(14px,-10px) scale(${sc})`;pop.style.transformOrigin='0 0';
 vimg.appendChild(pop);const ta=pop.querySelector('textarea'),nm=pop.querySelector('input'),go=pop.querySelector('.go');
 try{nm.value=localStorage.getItem('mk.name')||''}catch(e){}setTimeout(()=>ta.focus(),30);
 pop.addEventListener('pointerdown',e=>e.stopPropagation());
 const send=()=>{const t=ta.value.trim();if(!t){ta.focus();return}go.disabled=true;try{localStorage.setItem('mk.name',nm.value)}catch(e){}
  const link=location.origin+location.pathname+'#'+s.route+'@'+x.toFixed(1)+','+y.toFixed(1);
  post({flow:s.sec.title+' · '+s.flow.title,screen:s.label+' ('+s.route+') · пін '+x.toFixed(0)+'%,'+y.toFixed(0)+'%',name:nm.value.trim()||'Анонім',text:t,page:link},()=>{
   savePin({route:s.route,x,y,t:Date.now()});showV();pinCounts();toastOn()})};
 go.onclick=send;ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send()}if(e.key==='Escape'){e.stopPropagation();pop.remove();vimg.querySelector('.pin.tmp')?.remove()}});}
function flowComment(btn){const f=DATA.flatMap(s=>s.flows.map(x=>({x,s}))).find(o=>o.x.id===btn.dataset.cflow);
 document.querySelectorAll('.fpop').forEach(n=>n.remove());const pop=document.createElement('div');pop.className='pop fpop';pop.style.position='fixed';
 const r=btn.getBoundingClientRect();pop.style.left=Math.min(innerWidth-336,r.left)+'px';pop.style.top=Math.max(70,r.top-190)+'px';
 pop.innerHTML='<textarea placeholder="Коментар до всього флоу «'+f.x.title+'»"></textarea><div class="r"><input placeholder="Ваше імʼя"><button class="go">Надіслати</button></div>';
 document.body.appendChild(pop);const ta=pop.querySelector('textarea'),nm=pop.querySelector('input');try{nm.value=localStorage.getItem('mk.name')||''}catch(e){}ta.focus();
 pop.querySelector('.go').onclick=()=>{const t=ta.value.trim();if(!t)return;post({flow:f.s.title+' · '+f.x.title,screen:'(увесь флоу)',name:nm.value.trim()||'Анонім',text:t,page:location.origin+location.pathname+'#'+f.x.id},()=>{pop.remove();toastOn()})};
 setTimeout(()=>document.addEventListener('pointerdown',function h(e){if(!e.target.closest('.fpop')){pop.remove();document.removeEventListener('pointerdown',h)}}),0);}
function toastOn(){$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1800)}
function post(d,done){const f=document.createElement('form');f.method='POST';f.action=FORM.action;f.target='gsink';f.hidden=true;
 const m={[FORM.fields.flow]:d.flow,[FORM.fields.screen]:d.screen,[FORM.fields.name]:d.name,[FORM.fields.text]:d.text,[FORM.fields.page]:d.page};
 for(const k in m){const i=document.createElement('textarea');i.name=k;i.value=m[k];f.appendChild(i)}document.body.appendChild(f);f.submit();setTimeout(()=>{f.remove();done&&done()},600)}
/* keys */
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;const vOn=$('#viewer').classList.contains('on');
 if(e.key==='/'&&!vOn){e.preventDefault();$('#q').focus();return}
 if(!vOn)return;
 if(e.key==='Escape')closeV();else if(e.key==='ArrowRight')$('#vnext').click();else if(e.key==='ArrowLeft')$('#vprev').click();
 else if(e.key==='0')vFit();else if(e.key==='1')v100();else if(e.key==='c'||e.key==='с')$('#vpin').click();
 else if(e.key==='+'||e.key==='=')vZoomAt(1.25,vs.clientWidth/2,vs.clientHeight/2);else if(e.key==='-')vZoomAt(.8,vs.clientWidth/2,vs.clientHeight/2)});
$('#q').addEventListener('input',()=>render());
$('#burger').onclick=()=>document.body.classList.toggle('menu');
render();
try{if(localStorage.getItem('mk.mode')==='canvas'&&innerWidth>900)setMode('canvas')}catch(e){}
/* deep links: #flow, #route, #route@x,y */
(function(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return;const m=h.match(/^([A-Za-z0-9_]+)@([\d.]+),([\d.]+)$/);
 if(m){openViewer(m[1]);setTimeout(()=>addPin(+m[2],+m[3],'tmp','!'),120);return}
 if(all.some(a=>a.route===h))openViewer(h);else setTimeout(()=>goFlow(h),60)})();
