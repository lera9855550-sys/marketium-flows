let timerIv = 0;
const isUrg = s => s > 0 && s <= 10;
DS.add({
 id: 'round-timer', group: 'game', title: 'Таймер раунду', swift: 'MKRoundTimer', file: 'MKGameComponents.swift',
 what: 'Головне число екрана раунду (<code>numeral</code> 28) і смужка <b>MKTimerProgress</b> над ним. Останні 10 секунд обидва персикові, а цифра коротко пульсує на кожній секунді разом зі звуком. Тапни цифру або увімкни «Відлік іде».',
 bg: 'game', center: true,
 props: { seconds: 14, total: 60, running: false },
 controls: [
  { k: 'running', label: 'Відлік іде', type: 'bool' },
  { k: 'seconds', label: 'Залишилось', type: 'range', min: 0, max: 120, step: 1, unit: ' с' },
  { k: 'total', label: 'Тривалість раунду', type: 'seg', options: [[40, '40'], [60, '60'], [90, '90'], [120, '120']] },
 ],
 hint: 'Смужка: трек <code>muted</code>, заливка <code>accent</code>, в останні секунди <code>warm</code>.',
 render: p => {
  const s = Math.min(p.seconds, p.total), u = isUrg(s);
  return `<div class="mkg-timerwrap"><div class="mkg-prog ${u ? 'urgent' : ''}" data-prog role="progressbar" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${s}"><i style="width:${s / p.total * 100}%"></i></div>
   <span class="mkg-timer ${u ? 'urgent' : ''}" data-t role="timer" aria-label="Залишилось ${s} с">${s}</span></div>`;
 },
 mount(el, p, ctx) {
  clearInterval(timerIv);
  const t = el.querySelector('[data-t]'), pr = el.querySelector('[data-prog]');
  t.addEventListener('click', () => { if (!p.running && p.seconds <= 0) p.seconds = p.total; ctx.set('running', !p.running); });
  if (!p.running) return;
  if (p.seconds > p.total || p.seconds <= 0) p.seconds = p.total;
  const box = document.querySelector('[data-ctrls="round-timer"] input[data-k="seconds"]');
  timerIv = setInterval(() => {
   if (!t.isConnected) { clearInterval(timerIv); return; }
   p.seconds = Math.max(0, p.seconds - 1);
   const s = p.seconds, u = isUrg(s);
   t.textContent = s; t.classList.toggle('urgent', u);
   t.classList.remove('pulse'); void t.offsetWidth; if (u) t.classList.add('pulse');
   pr.classList.toggle('urgent', u); pr.firstElementChild.style.width = (s / p.total * 100) + '%';
   if (box) { box.value = s; const rv = box.parentElement.querySelector('.rv'); if (rv) rv.textContent = s + ' с'; }
   if (s === 0) { clearInterval(timerIv); setTimeout(() => ctx.set('running', false), 400); }
  }, 1000);
 },
 states: [

const CN = 120, CD = 5.5;
const CCOL = ['#F8C294', '#A3D0F8', '#FABEC3', '#D6F5B2', '#FFD000', '#1B67F5'];
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function makePieces(count, rnd = Math.random) {
 const R = (a, b) => a + rnd() * (b - a);
 return Array.from({ length: count }, () => {
  const round = rnd() < .5 && rnd() < .5, w = R(7, 12);
  return { x: R(0, 1), delay: R(0, .8), startY: R(-.12, -.02), speed: R(.2, .32), drift: R(6, 22), phase: R(0, Math.PI * 2), spin: R(-1.2, 1.2),
   w: round ? w * .8 : w, h: round ? w * .8 : w * 1.6, color: CCOL[Math.floor(rnd() * CCOL.length)], round };
 });
}
function pieceAt(pc, t, W, H, dur) {
 const lt = t - pc.delay; if (lt <= 0) return null;
 const y = pc.startY * H + lt * pc.speed * H; if (y >= H + 20) return null;
 const x = pc.x * W + Math.sin(lt * 2.4 + pc.phase) * pc.drift;
 return { x, y, fade: Math.max(0, Math.min(1, (dur - t) / (dur * .25))), rot: lt * pc.spin * Math.PI * 2, sx: Math.abs(Math.cos(lt * 3 + pc.phase)) * .8 + .2 };
}

function staticConfetti(p, W = 360, H = 240) {

 const ps = makePieces(CN, rng(7)), t = 1.3;
 return `<svg class="c" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ps.map(pc => {
  const s = pieceAt(pc, t, W, H, CD); if (!s) return '';
  const tr = `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) rotate(${(s.rot * 180 / Math.PI).toFixed(1)}) scale(${s.sx.toFixed(2)} 1)`;
  return pc.round ? `<ellipse transform="${tr}" rx="${pc.w / 2}" ry="${pc.h / 2}" fill="${pc.color}" opacity="${s.fade}"/>` : `<rect transform="${tr}" x="${-pc.w / 2}" y="${-pc.h / 2}" width="${pc.w}" height="${pc.h}" fill="${pc.color}" opacity="${s.fade}"/>`;
 }).join('')}</svg>`;
