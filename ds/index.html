<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Marketium Design System</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Exo+2:wght@400;500;600;700&display=swap">
<style>
/* ── Оболонка сайту: та сама мова, що й сайт флоу ─────────────────── */
:root{
 color-scheme:dark;
 --bg:#0E0F12;--side:#141519;--panel:#1A1C21;--panel2:#20232A;--line:#26282F;--line2:#33363F;
 --text:#F2F3F5;--muted:#8D92A0;--dim:#5E6370;--accent:#1B67F5;--accent2:#4C8DFF;--ok:#4CAF50;--warn:#F8C294;
 --side-w:300px;--bar:60px;
 --ui:"Exo 2",system-ui,-apple-system,sans-serif;--display:"Unbounded","Exo 2",system-ui,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em}
.bar{position:fixed;inset:0 0 auto 0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 18px 0;display:flex;align-items:center;gap:14px;background:rgba(14,15,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:50}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.sp{flex:1}
.toplink{font-size:13px;color:var(--muted);padding:7px 12px;border:1px solid var(--line2);border-radius:18px;white-space:nowrap}
.toplink:hover{color:var(--text);border-color:var(--muted)}
.burger{display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center}
.side{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--side-w);overflow-y:auto;padding:18px 10px 60px;background:var(--side);border-right:1px solid var(--line);z-index:40;scrollbar-width:thin}
.sec{margin-bottom:6px}
.sec>button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;font-size:17px;font-weight:500;text-align:left}
.sec>button:hover{background:var(--panel)}
.sec>button svg{width:12px;height:12px;color:var(--muted);transition:transform .15s;flex:none}
.sec.closed>button svg{transform:rotate(-90deg)}
.sec .n{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.sec ul{list-style:none;margin:2px 0 8px;padding:0}
.sec.closed ul{display:none}
.sec li a{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 32px;border-radius:9px;font-size:15px;color:var(--muted)}
.sec li a:hover{background:var(--panel);color:var(--text)}
.sec li a.on{color:var(--text);background:var(--panel)}
.sec li a.on::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent2);margin-left:-14px}
main{margin-left:var(--side-w);padding:calc(var(--bar) + env(safe-area-inset-top,0px) + 28px) 40px 160px;max-width:calc(var(--side-w) + 1180px)}
.sechead{padding:16px 0 26px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;scroll-margin-top:calc(var(--bar) + 10px)}
.sechead h2{margin:0;font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.01em}
.sechead span{color:var(--muted);font-size:14px}
.lead{color:var(--muted);font-size:16px;line-height:1.55;max-width:68ch;margin:-12px 0 28px}
.block{padding:0 0 64px;scroll-margin-top:calc(var(--bar) + 16px)}
.bhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bhead h3{margin:0;font-family:var(--display);font-weight:500;font-size:20px;text-wrap:balance}
.swift{font-family:var(--mono);font-size:12.5px;color:var(--accent2);background:rgba(76,141,255,.1);padding:3px 8px;border-radius:6px;white-space:nowrap}
.used{font-size:13px;color:var(--dim)}
.what{color:var(--muted);font-size:15px;line-height:1.55;max-width:70ch;margin:0 0 18px}
.what b{color:var(--text);font-weight:600}
/* сцена + панель керування */
.play{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:stretch}
.stage{position:relative;border-radius:22px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center;padding:36px 0;box-shadow:0 0 0 1px var(--line)}
.stage .dev{position:relative;width:393px;max-width:100%;padding:0 20px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.stage .dev.center{align-items:center}
.stage[data-bg=screen]{background:#0B132B}
.stage[data-bg=screen]::before{content:"";position:absolute;width:482px;height:482px;border-radius:50%;background:#9EBAE1;filter:blur(90px);opacity:.2;left:calc(50% - 181px);top:-120px;pointer-events:none}
.stage[data-bg=game]{background:#0B132B url(a/game-bg.webp) center/cover}
.stage[data-bg=game]::after{content:"";position:absolute;inset:0;background:rgba(11,19,43,.35);pointer-events:none}
.stage[data-bg=game] .dev{z-index:1}
.stage[data-bg=sheet]{background:#F5F4F4}
.stage[data-bg=card]{background:#FFFFFF}
.stage[data-bg=darksheet]{background:#181818}
.stage[data-bg=modal]{background:rgba(11,19,43,.55)}
.ctrls{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctrls:empty{display:none}
.ctrl label,.ctrl .lbl{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.segc{display:flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.segc button{flex:1 1 auto;height:28px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.segc button.on{background:var(--line2);color:var(--text)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.sw input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}
.ctrl input[type=text]{width:100%;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 10px;font:inherit;font-size:14px}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .rv{float:right;color:var(--text);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.hint{font-size:12.5px;color:var(--dim);line-height:1.45}
/* усі стани поруч */
.states{display:flex;gap:12px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
.states figure{margin:0;flex:none}
.states .mini{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;padding:18px 16px;min-height:96px;position:relative}
.states .mini>.dev{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center}
.states figcaption{font-size:12.5px;color:var(--muted);padding:8px 2px 0;max-width:260px}
.states .mini[data-bg=screen]{background:#0B132B}.states .mini[data-bg=sheet]{background:#F5F4F4}.states .mini[data-bg=card]{background:#fff}.states .mini[data-bg=darksheet]{background:#181818}
.states .mini[data-bg=game]{background:#0B132B url(a/game-bg.webp) center/cover}
.states .mini[data-bg=modal]{background:#2a2f3d}
/* спека для розробника — згорнута */
details.devspec{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--side)}
details.devspec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--muted)}
details.devspec>summary::-webkit-details-marker{display:none}
details.devspec>summary svg{width:12px;height:12px;transition:transform .15s;transform:rotate(-90deg)}
details.devspec[open]>summary svg{transform:none}
details.devspec>summary:hover{color:var(--text)}
details.devspec>summary .sm{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.spec{padding:4px 16px 16px;display:grid;gap:14px}
.spec h5{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.spec ul{margin:0;padding-left:18px;color:var(--text);font-size:14px;line-height:1.55}
.spec li{margin:2px 0}
.spec li code,.spec p code{color:#C9D6FF;background:var(--panel);padding:1px 5px;border-radius:5px}
.spec p{margin:0;font-size:14px;line-height:1.5;color:var(--text)}
.codebox{position:relative}
.codebox pre{margin:0;background:#0A0B0E;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#DDE3F0}
.codebox .cp{position:absolute;top:8px;right:8px;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;background:var(--panel)}
.codebox .cp:hover{color:var(--text)}
.tok{color:#8FB5FF}.str{color:#F8C294}.kw{color:#E58FB5}.cm{color:#5E6370}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files span{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
/* основи */
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.swc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.swc .chip{height:72px;position:relative}
.swc .chip.checker{background-image:linear-gradient(45deg,#2a2d35 25%,transparent 25%,transparent 75%,#2a2d35 75%),linear-gradient(45deg,#2a2d35 25%,transparent 25%,transparent 75%,#2a2d35 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.swc .chip i{position:absolute;inset:0}
.swc .meta{padding:9px 11px 11px}
.swc .meta b{display:block;font-size:14px;font-weight:600}
.swc .meta code{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.swc .meta span{display:block;color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.35}
.swc:hover{border-color:var(--line2)}
.grp{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grpdoc{margin:-4px 0 12px;color:var(--dim);font-size:13.5px}
.rolerow{display:grid;grid-template-columns:44px 190px 1fr 150px;gap:14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rolerow:last-child{border-bottom:0}
.rolerow .dot.chk{background-image:linear-gradient(45deg,#2a2d35 25%,transparent 25%,transparent 75%,#2a2d35 75%),linear-gradient(45deg,#2a2d35 25%,transparent 25%,transparent 75%,#2a2d35 75%);background-size:10px 10px;background-position:0 0,5px 5px;background-color:#1A1C21}
.rolerow .dot{width:44px;height:32px;border-radius:9px;box-shadow:0 0 0 1px var(--line2) inset;position:relative;overflow:hidden}
.rolerow b{font-family:var(--mono);font-size:13.5px;font-weight:500}
.rolerow span{color:var(--muted);font-size:14px;line-height:1.4}
.rolerow code{color:var(--dim);font-size:12px;text-align:right}
.roles{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
.roles h4{margin:0;padding:12px 12px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.typerow{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.typerow:last-child{border-bottom:0}
.typerow .spc b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent2)}
.typerow .spc span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.typerow .smp{overflow-wrap:anywhere}
.scale{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
.mrow{display:grid;grid-template-columns:90px 60px 1fr;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow b{font-family:var(--mono);font-size:13.5px;font-weight:500}
.mrow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.mrow .vis{display:flex;align-items:center;gap:14px;min-width:0}
.mrow .vis span{color:var(--dim);font-size:13px;line-height:1.35}
.bartok{height:14px;background:var(--accent);border-radius:3px;flex:none}
.radtok{width:56px;height:56px;background:#E1EDFD;flex:none}
.alph{display:flex;gap:0;border-radius:10px;overflow:hidden;flex:none}
.alph i{width:48px;height:36px;display:block}
.shadowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.shadowgrid figure{margin:0;background:#F5F4F4;border-radius:16px;padding:30px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.shadowgrid figure.dk{background:#0B132B}
.shadowgrid .sq{width:120px;height:72px;background:#fff;border-radius:18px}
.shadowgrid figcaption{color:#0B132B;font-size:13px;text-align:center;line-height:1.4}
.shadowgrid figure.dk figcaption{color:#fff}
.shadowgrid figcaption b{font-family:var(--mono);font-weight:500;display:block}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:22px}
.icgrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.icgrid code{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.icgrid img{height:28px;width:auto}
.avgrid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.avgrid figure{margin:0;text-align:center}
.avgrid figcaption{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.rules{display:grid;gap:10px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.rule>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:4px}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary b{font-size:15.5px;font-weight:600}
.rule>summary span{color:var(--muted);font-size:14px;line-height:1.45}
.rule .rb{padding:0 16px 16px;color:#C8CCD6;font-size:14px;line-height:1.6;max-width:80ch}
.rule .rb code{color:#C9D6FF;background:var(--bg);padding:1px 5px;border-radius:5px}
.rule .rb table{border-collapse:collapse;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
.rule .rb td,.rule .rb th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.principles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:10px}
.principles div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.principles b{display:block;font-family:var(--display);font-weight:500;font-size:15px;margin-bottom:6px}
.principles span{color:var(--muted);font-size:14px;line-height:1.5}
.empty{padding:60px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;z-index:200;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1100px){.play{grid-template-columns:1fr}.ctrls{align-self:stretch}}
@media (max-width:900px){
 :root{--side-w:0px}
 .side{width:280px;transform:translateX(-100%);transition:transform .2s}
 body.menu .side{transform:none}
 .burger{display:flex}
 .brand span,.hidem,.toplink{display:none}
 main{padding-left:16px;padding-right:16px}
 .rolerow{grid-template-columns:40px 1fr;row-gap:4px}.rolerow span{grid-column:2}.rolerow code{grid-column:2;text-align:left}
 .typerow{grid-template-columns:1fr}
 .mrow{grid-template-columns:70px 44px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* ── Токени й компоненти застосунку (генерується з коду) ─────────── */
:root{
 --pal-p100:#E1EDFD;
 --pal-p300:#A3D0F8;
 --pal-p500:#42A5F5;
 --pal-p600:#1B67F5;
 --pal-p950:#0B132B;
 --pal-n50:#FFFFFF;
 --pal-n200:#D8D8D8;
 --pal-n400:#B1B1B1;
 --pal-n700:#636363;
 --pal-n900:#181818;
 --pal-blue:#9EBAE1;
 --pal-sheet:#F5F4F4;
 --pal-peach:#F8C294;
 --pal-peachDeep:#C2731C;
 --pal-king:#FFD000;
 --pal-error:#D32F2F;

 --pal-green200:#D6F5B2;
 --pal-grey600:#4A5572;
 --c-bgScreen:#0B132B;
 --c-bgSheet:#F5F4F4;
 --c-bgDarkSheet:#181818;
 --c-surfaceCard:#FFFFFF;

 --c-textPrimary:#0B132B;
 --c-textSecondary:#636363;
 --c-textTertiary:#B1B1B1;
 --c-textOnDark:#FFFFFF;
 --c-textOnDarkMuted:rgba(255,255,255,0.6);
 --c-accent:#1B67F5;
 --c-accentSoft:#A3D0F8;
 --c-accentOnDark:#42A5F5;
 --c-muted:#D8D8D8;

 --c-king:#FFD000;
 --c-warm:#F8C294;
 --c-warmDeep:#C2731C;

 --r-md:12px;
 --r-lg:18px;

 --grad-wordCard:linear-gradient(180deg,#F8C294 0%,#F8C294 30%,#1944AB 37%,#1944AB 79%,#EA82A0 86%,#EA82A0 100%);
}
.mk-t-display{font-family:"Unbounded","Exo 2",system-ui,sans-serif;font-weight:600;font-size:40px;letter-spacing:0px;line-height:1.24}
.mk-t-numeral{font-family:"Unbounded","Exo 2",system-ui,sans-serif;font-weight:600;font-size:28px;letter-spacing:0px;line-height:1.24}
.mk-t-word{font-family:"Unbounded","Exo 2",system-ui,sans-serif;font-weight:500;font-size:24px;letter-spacing:0.24px;line-height:1.24}
.mk-t-heading{font-family:"Unbounded","Exo 2",system-ui,sans-serif;font-weight:500;font-size:20px;letter-spacing:0.2px;line-height:1.24}
.mk-t-name{font-family:"Unbounded","Exo 2",system-ui,sans-serif;font-weight:400;font-size:18px;letter-spacing:0.18px;line-height:1.24}
