мір, іконку чи новий елемент інтерфейсу: знайди готове тут і візьми його.\u003c/p\u003e\u003ch3\u003eПорядок дій для будь-якої візуальної правки\u003c/h3\u003e\u003col\u003e\u003cli\u003eЗнайди потрібний токен або компонент у довіднику.\u003c/li\u003e\u003cli\u003eЄ: використай (\u003ccode\u003eMKColor.\u003ci\u003e\u003c/code\u003e, \u003ccode\u003eMKSpacing.\u003c/i\u003e\u003c/code\u003e, \u003ccode\u003eMKRadius.\u003ci\u003e\u003c/code\u003e, \u003ccode\u003e.mkText(.\u003c/i\u003e)\u003c/code\u003e, \u003ccode\u003eMK…\u003c/code\u003e-компонент).\u003c/li\u003e\u003cli\u003eНемає, але є щось дуже близьке: \u003cb\u003eрозшир наявне\u003c/b\u003e, не роби дубль.\u003c/li\u003e\u003cli\u003eСправді потрібне нове: додай у \u003ccode\u003eDesignSystem/\u003c/code\u003e з \u003ccode\u003e///\u003c/code\u003e-коментарем, і аж тоді використовуй. Воно само з&#x27;явиться в довіднику.\u003c/li\u003e\u003c/ol\u003e\u003ch3\u003eНіколи у Features/в&#x27;юхах\u003c/h3\u003e\u003cul\u003e\u003cli\u003eЛітерали кольору (\u003ccode\u003eColor(hex:)\u003c/code\u003e, \u003ccode\u003e.white\u003c/code\u003e, \u003ccode\u003e.black\u003c/code\u003e): тільки \u003ccode\u003eMKColor.\u003ci\u003e\u003c/code\u003e. Виняток: \u003ccode\u003ePalette.Content.\u003c/i\u003e\u003c/code\u003e (сети, аватари, декор: це дані).\u003c/li\u003e\u003cli\u003eЛітерали в \u003ccode\u003e.padding\u003c/code\u003e / \u003ccode\u003espacing:\u003c/code\u003e: тільки \u003ccode\u003eMKSpacing.*\u003c/code\u003e (перевірка \u003ccode\u003egrid4.py\u003c/code\u003e).\u003c/li\u003e\u003cli\u003eЛітерали в \u003ccode\u003eRoundedRectangle(cornerRadius:)\u003c/code\u003e: тільки \u003ccode\u003eMKRadius.*\u003c/code\u003e.\u003c/li\u003e\u003cli\u003e\u003ccode\u003e.font(.custom(...))\u003c/code\u003e: тільки \u003ccode\u003e.mkText(.стиль)\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eВласна \u003ccode\u003e.shadow(...)\u003c/code\u003e: тільки рецепти \u003ccode\u003eMKShadow\u003c/code\u003e / \u003ccode\u003e.mk…Shadow()\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eКоли код і довідник розходяться\u003c/h3\u003e\u003cp\u003e\u003cb\u003eПравда: у коді.\u003c/b\u003e Сайт застарів: перезбери його (\u003ccode\u003ebuild_ds_site.py\u003c/code\u003e → \u003ccode\u003e.dssite/build.py\u003c/code\u003e). Але якщо, пишучи нову в&#x27;юху, ти відчуваєш, що токена «не вистачає»,: це майже завжди означає взяти наявний, а не завести новий. Саме так система лишається малою: 23 кольори палітри, 24 ролі, 11 стилів тексту, 7 відступів, 6 радіусів.\u003c/p\u003e\u003cp\u003eПовний звід: у \u003ccode\u003eCLAUDE.md\u003c/code\u003e в корені репозиторію.\u003c/p\u003e","tags":"process source-of-truth tokens"},{"slug":"grid4","title":"Сітка 4","summary":"Усі відступи, проміжки й висоти кратні чотирьом і беруться з токенів. Літерали в .padding і spacing заборонені.","check":"python3 grid4.py","source":"Spacing-Rules.md (06.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eКожен відступ, проміжок і висота в застосунку: число, кратне \u003cb\u003e4\u003c/b\u003e, і йде з шкали \u003ccode\u003eMKSpacing\u003c/code\u003e (\u003cb\u003e4 · 8 · 12 · 16 · 24 · 32 · 40\u003c/b\u003e) або з висот \u003ccode\u003eMKSize\u003c/code\u003e. Літерал у \u003ccode\u003e.padding(…)\u003c/code\u003e, \u003ccode\u003espacing:\u003c/code\u003e чи \u003ccode\u003e.frame(height:)\u003c/code\u003e: помилка, навіть якщо число кратне чотирьом: завтра шкала зміниться, а літерал: ні.\u003c/p\u003e\u003ch3\u003eЩо не підпадає\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eКоординати полотна Figma\u003c/b\u003e в \u003ccode\u003emkPlace(x:y:width:height:)\u003c/code\u003e: це попіксельна відповідність макету, своя система координат. Скрипт їх не перевіряє.\u003c/li\u003e\u003cli\u003e\u003cb\u003eВолосяні лінії\u003c/b\u003e 1…2 pt (кант, роздільник).\u003c/li\u003e\u003cli\u003e\u003cb\u003eРадіуси\u003c/b\u003e \u003ccode\u003eMKRadius\u003c/code\u003e: своя шкала, не відступи (4 · 8 · 12 · 18 · 22 · 100).\u003c/li\u003e\u003cli\u003e\u003cb\u003eКеглі\u003c/b\u003e типографіки і \u003cb\u003eрозміри гліфів\u003c/b\u003e \u003ccode\u003eMKIconSize\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eРядок, позначений \u003ccode\u003e// grid4:ok\u003c/code\u003e: свідомий виняток із поясненням поруч.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eЧому\u003c/h3\u003e\u003cp\u003eПівкрокові значення (6, 10, 14) жили окремими токенами й давали три різні «внутрішні поля картки» на сусідніх екранах. Одна шкала: одна відповідь на питання «скільки тут відступ».\u003c/p\u003e\u003ch3\u003eЯк перевірити\u003c/h3\u003e\u003cp\u003e\u003ccode\u003epython3 grid4.py\u003c/code\u003e у корені проєкту: перевіряє \u003ccode\u003e.frame(height:)\u003c/code\u003e, \u003ccode\u003e.frame(minHeight:)\u003c/code\u003e, \u003ccode\u003espacing:\u003c/code\u003e і \u003ccode\u003e.padding(…)\u003c/code\u003e з числовим літералом. Вихід \u003ccode\u003eСітка 4: чисто ✓\u003c/code\u003e або список \u003ccode\u003eфайл:рядок значення\u003c/code\u003e; код повернення 1: можна вішати на pre-commit.\u003c/p\u003e","tags":""},{"slug":"edge","title":"Одне бічне поле: 20","summary":"Усе, що йде на всю ширину (картки, кнопки, поля, крокери), стоїть на одному полі MKLayout.edge = 20. side = 24: координата полотна Figma, не поле.","check":"заміряти кнопку і картку на одному екрані: одна межа","source":"Edge-Margin-Rule.md, Canvas-Card-Width.md (07.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eБічне поле для всього, що тягнеться на всю ширину екрана,: \u003cb\u003e20 pt\u003c/b\u003e (\u003ccode\u003eMKLayout.edge\u003c/code\u003e). Ширина такого елемента: \u003ccode\u003eMKLayout.fluid\u003c/code\u003e = ширина екрана − 2 × edge. Це одне число для карток, кнопок, полів, крокерів і нижньої панелі: на всіх екранах, і в кімнатах теж.\u003c/p\u003e\u003ch3\u003eДва числа, які легко переплутати\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eТокен\u003c/th\u003e\u003cth\u003eЗначення\u003c/th\u003e\u003cth\u003eЩо це\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.edge\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e20\u003c/td\u003e\u003ctd\u003eреальне поле на екрані для всього на всю ширину\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.side\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e24\u003c/td\u003e\u003ctd\u003eкоордината \u003cb\u003eмакета\u003c/b\u003e для \u003ccode\u003emkPlace\u003c/code\u003e на полотняних екранах; на ній тримається попіксельна звірка з Figma: не чіпати\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.cardSide\u003c/code\u003e / \u003ccode\u003ecardContent\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e20 / 353\u003c/td\u003e\u003ctd\u003eте саме поле 20, але в координатах полотна 393: для карток і полів, покладених \u003ccode\u003emkPlace\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eЗвідки число\u003c/h3\u003e\u003cp\u003eЗаміряно з еталонів на екрані 440: кнопка «Продовжити» 399.3 / поле 20.2, картка плану 399.3 / 20.2. Крокер давав ~17: це похибка вимірювання заокруглених кутів і тіні, а не друге число. \u003cb\u003eУрок:\u003c/b\u003e коли з еталона виходять різні числа для сусідніх елементів, це майже завжди одне число з похибкою.\u003c/p\u003e\u003ch3\u003eЯк перевірити\u003c/h3\u003e\u003cp\u003eНа екрані з карткою і кнопкою внизу ліва і права межі збігаються з точністю до пункту. \u003ccode\u003eMKSheetScreen\u003c/code\u003e бере \u003ccode\u003econtentWidth\u003c/code\u003e = \u003ccode\u003efluid\u003c/code\u003e за замовчуванням.\u003c/p\u003e","tags":""},{"slug":"rhythm","title":"Вертикальний ритм і поля карток","summary":"Секції через 24, заголовок → список 8, крок списку 8 (12 для ілюстрованих карток), усередині картки 16 по горизонталі й 12 по вертикалі.","check":"python3 grid4.py + скрін маршруту","source":"Spacing-Rules.md (06…07.09)","html":"\u003ch3\u003eНа листі\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eДе\u003c/th\u003e\u003cth\u003eКрок\u003c/th\u003e\u003cth\u003eТокен\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eМіж секціями\u003c/td\u003e\u003ctd\u003e\u003cb\u003e24\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.lg\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eЗаголовок секції → перша картка\u003c/td\u003e\u003ctd\u003e\u003cb\u003e8\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.xs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКрок у списку карток\u003c/td\u003e\u003ctd\u003e\u003cb\u003e8\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.xs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКрок для важких карток з ілюстрацією (набори слів)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e12\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.sm\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eСвідомий «стос» (учасники кімнати)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e4\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.xxs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eПідпис під заголовком\u003c/td\u003e\u003ctd\u003e\u003cb\u003e4\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSpacing.xxs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eОптичні зсуви: тільки \u003ccode\u003e.offset\u003c/code\u003e з коментарем, ніколи від&#x27;ємним падінгом.\u003c/p\u003e\u003ch3\u003eУсередині карток і контролів\u003c/h3\u003e\u003cul\u003e\u003cli\u003eКартка будь-якого типу: поле \u003cb\u003e16\u003c/b\u003e по горизонталі, \u003cb\u003e12\u003c/b\u003e по вертикалі в рядках списку (\u003ccode\u003eMKListCard\u003c/code\u003e). Ілюстровані картки наборів: рівномірне поле 16.\u003c/li\u003e\u003cli\u003eЧіп / капсула: \u003cb\u003e12 × 4\u003c/b\u003e; висоти чіпа: 24 / 32 / 40 (\u003ccode\u003eMKChip.Size\u003c/code\u003e).\u003c/li\u003e\u003cli\u003eІконка ↔ текст: \u003cb\u003e8\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eРядок / поле вводу: \u003cb\u003e56\u003c/b\u003e (\u003ccode\u003eMKSize.field\u003c/code\u003e). Плитка коду кімнати: 72, крок 4.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eНижня панель кнопок\u003c/h3\u003e\u003cp\u003e\u003cb\u003e16\u003c/b\u003e над кнопками, \u003cb\u003e32\u003c/b\u003e до безпечної зони; пара кнопок: крок \u003cb\u003e12\u003c/b\u003e. Панель живе в \u003ccode\u003ebottom:\u003c/code\u003e каркаса (див. «Нижні кнопки»).\u003c/p\u003e","tags":""},{"slug":"control-height","title":"Висоти контролів","summary":"Кнопки й усе, що з ними однієї висоти,: MKSize.control (52, на великих апаратах 56). Поле вводу: 56. Кнопка-іконка: 44.","check":"скрін home на Pro Max: кнопки й рядок «Словник слів» однієї висоти","source":"DS-Heights-Audit.md, Control-Height-Large-Devices.md (07.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eОднакові сутності: однакова висота, і всі з токенів \u003ccode\u003eMKSize\u003c/code\u003e:\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eСутність\u003c/th\u003e\u003cth\u003eВисота\u003c/th\u003e\u003cth\u003eТокен\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eКнопка CTA, мала діалогова кнопка\u003c/td\u003e\u003ctd\u003e\u003cb\u003e52 / 56\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSize.buttonLarge\u003c/code\u003e / \u003ccode\u003ebuttonSmall\u003c/code\u003e → \u003ccode\u003econtrol\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eРядок списку налаштувань, рядок вибору, рядок-дія («Словник слів»)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e52 / 56\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSize.row\u003c/code\u003e → \u003ccode\u003econtrol\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eПоле вводу, рядок з аватаром (команда, нік, лідерборд)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e56\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSize.field\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКнопка-іконка, стрілка «назад»\u003c/td\u003e\u003ctd\u003e\u003cb\u003e44\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKSize.buttonIcon\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКод кімнати (6 комірок)\u003c/td\u003e\u003ctd\u003e72\u003c/td\u003e\u003ctd\u003eокрема сутність, \u003ccode\u003eMKCodeInput\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eВеликі апарати\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eMKSize.control\u003c/code\u003e = \u003cb\u003e52\u003c/b\u003e на звичайних апаратах і \u003cb\u003e56\u003c/b\u003e на великих: Plus і Pro Max, ширина ≥ 428 (\u003ccode\u003eMKDevice.isLarge\u003c/code\u003e). Рішення власниці 07.09: на великих екранах контроли на пару пунктів вищі. Значення обчислюється під час верстки, тож апарат уже відомий; поле вводу лишається 56 всюди: на великих кнопка й поле однакові.\u003c/p\u003e\u003ch3\u003eПолотно\u003c/h3\u003e\u003cp\u003eНа полотняних екранах (\u003ccode\u003eMKCanvas\u003c/code\u003e, масштаб 440/393 = 1.12) \u003ccode\u003eMKButtonStyle\u003c/code\u003e ділить висоту на \u003ccode\u003emkCanvasScale\u003c/code\u003e, тож кнопка на екрані: рівно \u003ccode\u003econtrol\u003c/code\u003e, без масштабу. Зовнішній \u003ccode\u003e.frame(height:)\u003c/code\u003e над кнопкою не допомагає: стиль має власний фіксований фрейм, читати масштаб треба всередині стилю.\u003c/p\u003e","tags":""},{"slug":"bottom-buttons","title":"Нижні кнопки: одна панель","summary":"Будь-яка кнопка, прибита до низу екрана, живе в bottom: каркаса, а не в координатах полотна.","check":"низ останньої кнопки на всіх екранах: одне число від краю","source":"Bottom-Buttons-Rule.md (07.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eКнопки, що тримаються низу екрана, кладуться в \u003ccode\u003ebottom:\u003c/code\u003e каркаса (\u003ccode\u003eMKSheetScreen\u003c/code\u003e і \u003ccode\u003eMKSheetCanvas\u003c/code\u003e мають однаковий), а не через \u003ccode\u003emkPlace(y: 740)\u003c/code\u003e. Полотно: для композиції всередині листа; усе, що має триматись краю екрана, рахується від екрана.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eif hasBottom {\n    bottom()\n        .frame(width: MKLayout.fluid)\n        .padding(.top, MKSpacing.md)\n        .padding(.bottom, MKSpacing.xl)\n        .frame(maxWidth: .infinity)\n        .background(MKColor.bgSheet)\n}\u003c/code\u003e\u003c/pre\u003e\u003ch3\u003eЧому\u003c/h3\u003e\u003cp\u003eКоли лист переїхав вище, вміст полотна зсунувся вниз разом із кнопками, хоча низ екрана нікуди не рухався: на полотняних екранах низ кнопки опинився за 25 pt від краю, на потокових: за 66. Одна панель поза полотном прибрала розрив: на \u003ccode\u003egameMode\u003c/code\u003e, \u003ccode\u003eteamList\u003c/code\u003e, \u003ccode\u003erules\u003c/code\u003e, \u003ccode\u003eparticipantCount\u003c/code\u003e: те саме число.\u003c/p\u003e\u003ch3\u003eПастки\u003c/h3\u003e\u003cul\u003e\u003cli\u003eКрапки прогресу в правилах лишались на полотні й опинились під панеллю: усе, що йде разом із кнопкою, переїжджає в той самий \u003ccode\u003ebottom:\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eТемні ігрові екрани (\u003ccode\u003eMKGameCanvas\u003c/code\u003e) нижньої панелі не мають і не потребують: там кнопки: частина композиції раунду.\u003c/li\u003e\u003cli\u003eUI-тести: кнопки в панелі тапаються за назвою, а не координатами.\u003c/li\u003e\u003c/ul\u003e","tags":""},{"slug":"sheet-header","title":"Шапка над листом","summary":"Темна шапка над білим листом на всіх екранах однакова: верх листа MKLayout.sheetTop, заголовок на sheetHeaderTop.","check":"роути participantCount, teamList, setList: лист на одній висоті","source":"Sheet-Header-Height.md (06.09)","html":"\u003ch3\u003eЧисла\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eЗначення\u003c/th\u003e\u003cth\u003eТокен\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eВерх білого листа\u003c/td\u003e\u003ctd\u003e\u003cb\u003e152\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.sheetTop\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eВерх заголовка над листом\u003c/td\u003e\u003ctd\u003e\u003cb\u003e84\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.sheetHeaderTop\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eВерх заголовка на темному екрані без листа (гра, рейтинг)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e50\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.headerTop\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eРадіус верхніх кутів листа\u003c/td\u003e\u003ctd\u003e\u003cb\u003e22\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.sheetRadius\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eВерх листа в координатах старого макета\u003c/td\u003e\u003ctd\u003e104\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKLayout.designSheetTop\u003c/code\u003e: точка відліку \u003ccode\u003emkPlace\u003c/code\u003e, не чіпати\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eДва типи екранів\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eПотокові\u003c/b\u003e (\u003ccode\u003eMKSheetScreen\u003c/code\u003e) беруть константи напряму.\u003c/li\u003e\u003cli\u003e\u003cb\u003eПолотняні\u003c/b\u003e (\u003ccode\u003eMKSheetCanvas\u003c/code\u003e) мають координати вмісту з макета, де лист був на 104, тому вміст їде вниз на \u003ccode\u003eMKLayout.sheetShift\u003c/code\u003e = \u003ccode\u003esheetTop − designSheetTop\u003c/code\u003e, зберігаючи внутрішні відступи.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eПідняли шапку: змінюй \u003cb\u003eлише\u003c/b\u003e \u003ccode\u003esheetTop\u003c/code\u003e і \u003ccode\u003esheetHeaderTop\u003c/code\u003e; полотняні екрани підтягнуться самі. Виняток: вміст, якому нікуди їхати вниз (підвал налаштувань), його переставляють точково.\u003c/p\u003e","tags":""},{"slug":"typography","title":"Типографіка: 16 і нижче не буває","summary":"Дві сімʼї: Unbounded для заголовків і чисел, Exo 2 для решти. Стилі лише через .mkText(.x). Нижня межа шкали: 16 pt.","check":"grep \"size: 1[0-5]\" у Text: має бути порожньо (SF Symbols не рахуються)","source":"Type-Scale-Floor-14.md, Typography.swift (07.09), аудит ДС 22.09","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cul\u003e\u003cli\u003eТекст береться \u003cb\u003eлише\u003c/b\u003e через \u003ccode\u003e.mkText(.стиль)\u003c/code\u003e: жодних \u003ccode\u003e.font(.custom(…))\u003c/code\u003e у вʼюхах. Стилі: на сторінці \u003ca href=\"#/tokens/type\"\u003eТипографіка\u003c/a\u003e.\u003c/li\u003e\u003cli\u003e\u003cb\u003eUnbounded\u003c/b\u003e: заголовки, числа, слово на картці. \u003cb\u003eExo 2\u003c/b\u003e: усе інше: кнопки, поля, підписи, тіло.\u003c/li\u003e\u003cli\u003e\u003cb\u003eНижня межа: 16 pt.\u003c/b\u003e Кегль 14 визнано замалим 07.09 («165 слів» на картці не читалось), уся сходинка піднята до 16. Дрібніше в тексті не використовуємо.\u003c/li\u003e\u003cli\u003eUppercase-мітки («СЛОВО ДНЯ», «КОД КІМНАТИ»): \u003ccode\u003e.mkEyebrow()\u003c/code\u003e: \u003ccode\u003ecaptionStrong\u003c/code\u003e + uppercase + трекінг 1.2. Окремого «overline» немає.\u003c/li\u003e\u003cli\u003eТрекінг 1 % від кегля; числа (\u003ccode\u003enumeral\u003c/code\u003e, \u003ccode\u003edisplay\u003c/code\u003e): без трекінгу.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eЩо правило не стосується\u003c/h3\u003e\u003cp\u003e\u003ccode\u003e.font(.system(size:…))\u003c/code\u003e на \u003cb\u003eSF Symbols\u003c/b\u003e: це гліфи іконок, а не текст; їхні розміри: \u003ccode\u003eMKIconSize\u003c/code\u003e. Розміри поза шкалою (60 / 48 / 32 у крокері й відліку): геометрія компонента, не стиль.\u003c/p\u003e\u003ch3\u003eШкала: 11 стилів, 5 накреслень\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eСтиль\u003c/th\u003e\u003cth\u003eШрифт\u003c/th\u003e\u003cth\u003eДля чого\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edisplay\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded SemiBold 40\u003c/td\u003e\u003ctd\u003eкод кімнати, «ПЕРЕМОГА»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003enumeral\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded SemiBold 28\u003c/td\u003e\u003ctd\u003eчисло на плитці, таймер, рахунок\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eword\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded Medium 24\u003c/td\u003e\u003ctd\u003eслово на картці\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eheading\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded Medium 20\u003c/td\u003e\u003ctd\u003eзаголовок екрана, тарифу, модалки; «3/20» у рядку\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ename\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded Regular 18\u003c/td\u003e\u003ctd\u003eназва команди\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecardTitle\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eUnbounded Medium 16\u003c/td\u003e\u003ctd\u003eназва картки сету, рахунок у рядку\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebodyLarge\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eExo 2 Regular 20\u003c/td\u003e\u003ctd\u003eтекст поля, рядок налаштувань, назва на картці команди\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebody\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eExo 2 Regular 18\u003c/td\u003e\u003ctd\u003eтекст правил, ціна\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebodyStrong\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eExo 2 SemiBold 18\u003c/td\u003e\u003ctd\u003eкнопка, «+2»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecaption\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eExo 2 Regular 16\u003c/td\u003e\u003ctd\u003eпідпис, підказка, тост\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecaptionStrong\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eExo 2 SemiBold 16\u003c/td\u003e\u003ctd\u003eчіп, бейдж, статус, мітка капсом\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eУ бандлі п&#x27;ять файлів: Unbounded Regular · Medium · SemiBold, Exo 2 Regular · SemiBold. Light і Bold обох сімей та Exo 2 Medium прибрано: вони жили лише в сирих \u003ccode\u003e.font(.custom(…))\u003c/code\u003e.\u003c/p\u003e\u003ch3\u003eСтраховка\u003c/h3\u003e\u003cp\u003eТекст із фіксованою шириною (чіп «N СЛІВ» 88 pt) на 16 має \u003ccode\u003e.lineLimit(1).minimumScaleFactor(0.8)\u003c/code\u003e: стискається, а не ріжеться.\u003c/p\u003e","tags":""},{"slug":"text-wrap","title":"Текст не рветься і не обрізається","summary":"Дані-текст (слово, назва команди, набору): через .mkTerm(); багаторядковий текст у фіксованому контейнері: через .mkNoClip() і minHeight замість height.","check":"grep -rn minimumScaleFactor: поруч має бути lineLimit","source":"Word-Wrap-Rule.md (07.09)","html":"\u003ch3\u003eБаг 1: слово рветься посеред себе\u003c/h3\u003e\u003cp\u003e«Позиціонува / ння». У SwiftUI \u003ccode\u003eminimumScaleFactor\u003c/code\u003e вмикається \u003cb\u003eлише разом із \u003ccode\u003elineLimit\u003c/code\u003e\u003c/b\u003e; без нього текст бере скільки завгодно рядків і ріже слово навпіл.\u003c/p\u003e\u003cp\u003e\u003cb\u003eРішення\u003c/b\u003e: \u003ccode\u003e.mkTerm(lines:minScale:)\u003c/code\u003e (Typography.swift): спершу обмежує рядки, потім дозволяє тексту зменшитись, щоб слово влізло цілим.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eМісце\u003c/th\u003e\u003cth\u003eПараметри\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eІгрова картка слова\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elines: 3, minScale: 0.45\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКартка слова дня\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elines: 2, minScale: 0.5\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eФлешкартка: лице\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elines: 2, minScale: 0.45\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eРядок слова в підсумку\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elines: 2, minScale: 0.6\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eНазва на пʼєдесталі\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elines: 2, minScale: 0.65\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eЗастосовувати до \u003cb\u003eбудь-якого тексту з даних\u003c/b\u003e, який може бути довгим. Для інтерфейсного тексту фіксованої довжини не потрібно.\u003c/p\u003e\u003ch3\u003eБаг 2: текст обрізається трикрапкою\u003c/h3\u003e\u003cp\u003e«Торкнись картки, щоб…» замість двох рядків. Причина: \u003ccode\u003eText\u003c/code\u003e у контейнері з \u003cb\u003eжорсткою висотою\u003c/b\u003e (\u003ccode\u003emkPlace(height:)\u003c/code\u003e, \u003ccode\u003e.frame(height:)\u003c/code\u003e). SwiftUI не переносить, а ріже: особливо на полотняних екранах, де висоти з макета.\u003c/p\u003e\u003cp\u003e\u003cb\u003eРішення\u003c/b\u003e: \u003ccode\u003e.mkNoClip()\u003c/code\u003e (\u003ccode\u003efixedSize(horizontal: false, vertical: true)\u003c/code\u003e) плюс \u003ccode\u003eminHeight:\u003c/code\u003e замість \u003ccode\u003eheight:\u003c/code\u003e у контейнері.\u003c/p\u003e\u003ch3\u003eПрактичне правило\u003c/h3\u003e\u003cp\u003eЯкщо текст може бути довшим за один рядок, висота контейнера має бути \u003ccode\u003eminHeight\u003c/code\u003e, а не \u003ccode\u003eheight\u003c/code\u003e. Найшвидша перевірка: прогнати роут із найдовшим контентом і подивитись, чи немає «…» там, де його не мало бути.\u003c/p\u003e","tags":""},{"slug":"colors","title":"Кольори: 24 ролі, один колір на один зміст","summary":"Екрани звертаються лише до ролей MKColor; Palette: примітиви (виняток Content). Прозорість: тільки MKAlpha. Дублів немає: одна роль на один колір і один зміст.","check":"python3 check-style.py","source":"Colors.swift, Metrics.swift (MKAlpha)","html":"\u003ch3\u003eДва шари\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003e\u003ccode\u003ePalette\u003c/code\u003e\u003c/b\u003e: примітиви: \u003ccode\u003ePrimary\u003c/code\u003e (синя шкала p100 · p300 · p500 · p600 · p950), \u003ccode\u003eNeutral\u003c/code\u003e (n50 · n200 · n400 · n700 · n900), \u003ccode\u003eBg\u003c/code\u003e, \u003ccode\u003eStatus\u003c/code\u003e, \u003ccode\u003epeach\u003c/code\u003e, \u003ccode\u003eking\u003c/code\u003e, \u003ccode\u003eContent\u003c/code\u003e.\u003c/li\u003e\u003cli\u003e\u003cb\u003e\u003ccode\u003eMKColor\u003c/code\u003e\u003c/b\u003e: ролі, якими користуються екрани. Вʼюхи \u003cb\u003eне звертаються\u003c/b\u003e до \u003ccode\u003ePalette\u003c/code\u003e напряму; виняток: \u003ccode\u003ePalette.Content\u003c/code\u003e (кольори сетів, команд, аватарів: це дані, а не інтерфейс).\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eРолі\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eГрупа\u003c/th\u003e\u003cth\u003eРолі\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eПолотна\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ebgScreen\u003c/code\u003e (темний екран), \u003ccode\u003ebgSheet\u003c/code\u003e (світлий лист), \u003ccode\u003ebgDarkSheet\u003c/code\u003e (темний лист сету й пейволу)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eПоверхні\u003c/td\u003e\u003ctd\u003e\u003ccode\u003esurfaceCard\u003c/code\u003e (біла картка, поле), \u003ccode\u003esurfaceTint\u003c/code\u003e (заливка обраного, чіп), \u003ccode\u003esurfaceOnDark\u003c/code\u003e (плашка на темному)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eТекст\u003c/td\u003e\u003ctd\u003e\u003ccode\u003etextPrimary\u003c/code\u003e, \u003ccode\u003etextSecondary\u003c/code\u003e, \u003ccode\u003etextTertiary\u003c/code\u003e, \u003ccode\u003etextOnDark\u003c/code\u003e (і на синій кнопці), \u003ccode\u003etextOnDarkMuted\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eДія\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eaccent\u003c/code\u003e (дія, вибір, обране, «вчу»), \u003ccode\u003eaccentSoft\u003c/code\u003e (кант обраного чіпа, вимкнена кнопка), \u003ccode\u003eaccentOnDark\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eОбведення\u003c/td\u003e\u003ctd\u003e\u003ccode\u003emuted\u003c/code\u003e (нейтральний кант, роздільник, вимкнений трек), \u003ccode\u003estrokeSoft\u003c/code\u003e, \u003ccode\u003estrokeOnDark\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eСтани\u003c/td\u003e\u003ctd\u003e\u003ccode\u003esuccess\u003c/code\u003e (вивчено, відгадано), \u003ccode\u003eerror\u003c/code\u003e, \u003ccode\u003eking\u003c/code\u003e (бали, корона, лідер, серія), \u003ccode\u003ewarm\u003c/code\u003e (заборонене, порушення, останні секунди таймера, роль пояснювача), \u003ccode\u003ewarmDeep\u003c/code\u003e (текст і знак на персиковому: «ЗАБОРОНЕНО», «Стоп»)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eСерпанок і тінь\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehaze\u003c/code\u003e (пляма фону, тінь картки й кнопки), \u003ccode\u003eshadowInk\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eПравила\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eОдин колір, одна роль.\u003c/b\u003e Двох імен для того самого кольору немає: \u003ccode\u003eaccent\u003c/code\u003e замість \u003ccode\u003eactionPrimary\u003c/code\u003e, \u003ccode\u003estrokeSelected\u003c/code\u003e, \u003ccode\u003eselection\u003c/code\u003e, \u003ccode\u003estateProgress\u003c/code\u003e; \u003ccode\u003esuccess\u003c/code\u003e замість \u003ccode\u003estateLearned\u003c/code\u003e; \u003ccode\u003emuted\u003c/code\u003e замість \u003ccode\u003esurfaceMuted\u003c/code\u003e і \u003ccode\u003estrokeDefault\u003c/code\u003e; \u003ccode\u003ehaze\u003c/code\u003e замість \u003ccode\u003eshadowCard\u003c/code\u003e.\u003c/li\u003e\u003cli\u003e\u003cb\u003eЗелений один\u003c/b\u003e (\u003ccode\u003esuccess\u003c/code\u003e). Пастельний \u003ccode\u003eContent.green200\u003c/code\u003e: колір команди, не статус.\u003c/li\u003e\u003cli\u003e\u003cb\u003eСиній один.\u003c/b\u003e Пастельні сині сетів і команд: це \u003ccode\u003ePrimary.p100\u003c/code\u003e і \u003ccode\u003ep300\u003c/code\u003e.\u003c/li\u003e\u003cli\u003e\u003cb\u003eПерсиковий один\u003c/b\u003e (\u003ccode\u003epeach\u003c/code\u003e / \u003ccode\u003ewarm\u003c/code\u003e) і його темний відтінок для тексту (\u003ccode\u003epeachDeep\u003c/code\u003e / \u003ccode\u003ewarmDeep\u003c/code\u003e). Колишні \u003ccode\u003eorange300\u003c/code\u003e, \u003ccode\u003esun\u003c/code\u003e, \u003ccode\u003esunDeep\u003c/code\u003e злито з ними.\u003c/li\u003e\u003cli\u003e\u003cb\u003eРожевий один\u003c/b\u003e (\u003ccode\u003eContent.pink200\u003c/code\u003e): колір команди, картки «Складна гра», декор головної, плями деталки сету. Колишні \u003ccode\u003eBg.pink\u003c/code\u003e (\u003ccode\u003ehazePink\u003c/code\u003e) і бузковий \u003ccode\u003eplum\u003c/code\u003e злито з ним.\u003c/li\u003e\u003cli\u003e\u003cb\u003eЦіна\u003c/b\u003e: біла капсула з чорнилом, не зелена. Фіолетового в палітрі немає.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eПрозорість\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eЗначення\u003c/th\u003e\u003cth\u003eДля чого\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003efaint\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e0.08\u003c/td\u003e\u003ctd\u003eнайтихіше: сяйво в спокої, друга тінь\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etint\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e0.15\u003c/td\u003e\u003ctd\u003eзаливка під текстом, серпанок, тінь кнопки\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esoft\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e0.35\u003c/td\u003e\u003ctd\u003eкант, підкладка чіпа, мʼяка межа\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003estrong\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e0.55\u003c/td\u003e\u003ctd\u003eсяйво стану, акцентна підкладка\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eheavy\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e0.75\u003c/td\u003e\u003ctd\u003eмайже непрозора вуаль поверх темного\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eТінь ніколи не чорна: \u003ccode\u003eMKColor.shadowInk\u003c/code\u003e (p950) або \u003ccode\u003ehaze\u003c/code\u003e.\u003c/p\u003e","tags":""},{"slug":"glow","title":"Тіні та сяйво","summary":"Тінь має рівно два кольори і чотири рецепти. Розмиті кола: лише на рівні фону, не всередині скрола. Між картками списку тіні немає.","check":"роут scanQR: жодних рівних зрізів сяйва по краях скрола","source":"Glow-Clipping-Rule.md, Metrics.swift (MKShadow), рішення 07.09","html":"\u003ch3\u003eРецепти\u003c/h3\u003e\u003cp\u003eУсі тіні: через \u003ccode\u003eMKShadow\u003c/code\u003e / модифікатори \u003ccode\u003e.mkCardShadow()\u003c/code\u003e, \u003ccode\u003e.mkShadowButton()\u003c/code\u003e, \u003ccode\u003e.mkModalShadow()\u003c/code\u003e, \u003ccode\u003e.mkGlow()\u003c/code\u003e. Кольори тіней: \u003ccode\u003ehaze\u003c/code\u003e (блакитний серпанок, тінь картки й кнопки), \u003ccode\u003eaccent\u003c/code\u003e (синє сяйво гри) і \u003ccode\u003eshadowInk\u003c/code\u003e (далека тінь модалки). Кольорових тіней (рожевих тощо) у ДС більше немає. Повний список: \u003ca href=\"#/tokens/shadows\"\u003eТіні й сяйво\u003c/a\u003e.\u003c/p\u003e\u003ch3\u003eДе тіні немає\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eТемні плитки\u003c/b\u003e: контраст тримає сам (05.09).\u003c/li\u003e\u003cli\u003e\u003cb\u003eКартки на сірому листі\u003c/b\u003e (\u003ccode\u003eMKListCard\u003c/code\u003e, рядки словника, підсумок раунду): біла заливка + \u003ccode\u003e.mkCardShadow()\u003c/code\u003e мінімальна (faint, r4, y1): рішення 20.09. Інших тіней між картками немає.\u003c/li\u003e\u003cli\u003e\u003cb\u003eПастельні картки\u003c/b\u003e («Спосіб гри», режими, Pro): без зовнішньої тіні; тінь має лише 3D-стікер (\u003ccode\u003eshadowInk\u003c/code\u003e @ tint).\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eРозмиті кола\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eblur(radius: 60)\u003c/code\u003e розтягує пляму далеко за межі форми, а \u003ccode\u003eScrollView\u003c/code\u003e обрізає вміст: виходить рівний прямокутний зріз. Тому:\u003c/p\u003e\u003cul\u003e\u003cli\u003eДекоративне світіння: \u003cb\u003eтінню від форми\u003c/b\u003e, а не окремим \u003ccode\u003eblur\u003c/code\u003e-колом.\u003c/li\u003e\u003cli\u003eКола з \u003ccode\u003eblur\u003c/code\u003e лишаємо лише на рівні фону екрана (\u003ccode\u003eMKBlob\u003c/code\u003e), де їх нікому обрізати. \u003ccode\u003eMKBlob\u003c/code\u003e як дитина \u003ccode\u003eZStack\u003c/code\u003e листа ламає його кути: класти оверлеєм на фон.\u003c/li\u003e\u003cli\u003eЯкщо все ж потрібне \u003ccode\u003eblur\u003c/code\u003e-коло всередині скрола: воно має вміститись у бічне поле; реальний виліт ≈ 2…3 × \u003ccode\u003eradius\u003c/code\u003e, а не \u003ccode\u003eradius\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e","tags":""},{"slug":"input","title":"Поле вводу: один компонент, стани зверху","summary":"Одне поле MKInputField на всю апку, без варіанта onCard. Біла заливка + м'яка тінь читається і на сірому листі, і на білій картці. Кант лишається лише фокусу й помилці; решта: стани компонента.","check":"роути playerNameFilled, teamListRename, joinRoomFilled","source":"Input-Filled-Style.md (07.09), уніфікація 08.09","html":"\u003ch3\u003eОдин компонент\u003c/h3\u003e\u003cp\u003eУсі поля вводу: це \u003cb\u003e\u003ccode\u003eMKInputField\u003c/code\u003e\u003c/b\u003e з переліком станів \u003cb\u003e\u003ccode\u003eMKInputState\u003c/code\u003e\u003c/b\u003e. Окремого варіанта \u003ccode\u003eonCard\u003c/code\u003e більше немає (прибрано 08.09): один вигляд працює скрізь. Поле: м&#x27;яка плашка, а не друга кнопка поруч із CTA.\u003c/p\u003e\u003ch3\u003eБазовий вигляд (стан спокою)\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eЗначення\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eРадіус\u003c/td\u003e\u003ctd\u003e\u003cb\u003e18\u003c/b\u003e (= картка списку)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eЗаливка\u003c/td\u003e\u003ctd\u003eбіла (\u003ccode\u003eMKColor.surfaceCard\u003c/code\u003e): завжди\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eТінь\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehaze\u003c/code\u003e @ tint: м&#x27;який підйом, що відділяє поле і від сірого листа, і від білої картки\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eКант у спокої\u003c/td\u003e\u003ctd\u003eнемає\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eВисота\u003c/td\u003e\u003ctd\u003e\u003cb\u003e56\u003c/b\u003e (\u003ccode\u003eMKSize.field\u003c/code\u003e)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eЧому біла заливка + тінь, а не окрема сіра заливка: щоб мати \u003cb\u003eодин\u003c/b\u003e вигляд на будь-якому тлі. Раніше поле на білій картці робили сірим (\u003ccode\u003eonCard: true\u003c/code\u003e, роль \u003ccode\u003efieldOnCard\u003c/code\u003e), а на сірому листі: білим; це два вигляди одного поля. Тепер біле поле з м&#x27;якою тінню однаково читається на обох (тінь дає підйом), тож і варіант \u003ccode\u003eonCard\u003c/code\u003e, і роль \u003ccode\u003efieldOnCard\u003c/code\u003e прибрані (08.09).\u003c/p\u003e\u003ch3\u003eСтани (\u003ccode\u003eMKInputState\u003c/code\u003e)\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eСтан\u003c/th\u003e\u003cth\u003eЩо змінюється\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.normal\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eбазовий вигляд\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.active\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eкант \u003cb\u003e1.5 pt\u003c/b\u003e \u003ccode\u003eMKColor.accent\u003c/code\u003e (фокус)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.filled\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eправоруч хрестик очищення\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.error(msg)\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eкант \u003cb\u003e1 pt\u003c/b\u003e \u003ccode\u003eMKColor.error\u003c/code\u003e + підказка знизу\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.deleting\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eполе стискається, праворуч зʼявляється кошик\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003eMKInputField(text: $name, placeholder: &quot;Нік&quot;, state: inputState)   // будь-де: лист чи картка\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eКант несе лише \u003cb\u003eстан\u003c/b\u003e (синій: фокус, червоний: помилка), а не форму. Хрестик очищення: \u003ccode\u003exmark.circle.fill\u003c/code\u003e у \u003ccode\u003emuted\u003c/code\u003e.\u003c/p\u003e","tags":"input states component"},{"slug":"radius-icons","title":"Радіуси й іконки: лише токени","summary":"У RoundedRectangle: тільки MKRadius (6 значень); розміри гліфів: тільки MKIconSize. Обидві шкали свої, не ÷4.","check":"grep -rn \"cornerRadius: [0-9]\": має бути порожньо","source":"Metrics.swift (аудит 07.09)","html":"\u003ch3\u003eРадіуси: шість значень\u003c/h3\u003e\u003cp\u003eДо аудиту було \u003cb\u003e15 токенів на 10 значень\u003c/b\u003e: \u003ccode\u003ebutton\u003c/code\u003e/\u003ccode\u003emd\u003c/code\u003e = 12, \u003ccode\u003einput\u003c/code\u003e/\u003ccode\u003elistCard\u003c/code\u003e = 18, \u003ccode\u003ecard\u003c/code\u003e/\u003ccode\u003etile\u003c/code\u003e/\u003ccode\u003esheet\u003c/code\u003e = 22, \u003ccode\u003echip\u003c/code\u003e/\u003ccode\u003epill\u003c/code\u003e = 100, а ще окремі 2, 16, 24, 26. Звели до \u003cb\u003e6\u003c/b\u003e: 2→4, 16→18, 24→22, 26→22, і прибрали дублі-псевдоніми.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eТокен\u003c/th\u003e\u003cth\u003eЗначення\u003c/th\u003e\u003cth\u003eДе\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.xs\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eкорінець картки, кутик, тонка смужка-індикатор\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.sm\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003eмаленькі плашки: бейдж у грі, підказка\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.md\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e12\u003c/td\u003e\u003ctd\u003eкнопка, комірка коду кімнати\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.lg\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e18\u003c/td\u003e\u003ctd\u003eполе вводу, картка в списку (словник, історія), картка плану пейволу\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.xl\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e22\u003c/td\u003e\u003ctd\u003eкартка, лист, плитка, модалка, великий лист-список\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRadius.pill\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e100\u003c/td\u003e\u003ctd\u003eкапсула: чіп, пігулка, тег\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eРадіуси: форма з макета, \u003cb\u003eвласна шкала\u003c/b\u003e (не кратна 4): правило сітки 4 їх не стосується. Правило тут своє: у \u003ccode\u003eRoundedRectangle\u003c/code\u003e: тільки токен, ніяких літералів.\u003c/p\u003e\u003ch3\u003eІконки\u003c/h3\u003e\u003cp\u003eБуло девʼять розмірів на однакових за роллю іконках: шеврон малювався сімома способами. Тепер \u003ccode\u003eMKIconSize\u003c/code\u003e: \u003cb\u003e12 · 16 · 20 · 24 · ?\u003c/b\u003e (xs: стрілка в лічильнику, sm: шеврон рядка, md: іконка в рядку, lg: іконка в кнопці 44, hero: символ-ілюстрація порожнього стану).\u003c/p\u003e\u003cp\u003e\u003cb\u003eПлашка під іконкою\u003c/b\u003e: \u003ccode\u003eMKIconPlate\u003c/code\u003e: плоска пастельна плашка з палітри карток, радіус ≈ 0.3 розміру, без градієнтів, бліків і тіней; на ній темний SF-символ або растровий 3D-стікер (стікер займає 0.875 плашки).\u003c/p\u003e","tags":"radius icons tokens"},{"slug":"canvas","title":"Полотно і потік","summary":"Два типи екранів: полотняні (mkPlace у координатах макета 393, масштабуються) і потокові (реальні пункти). Не змішувати системи координат.","check":"скрін на 17 Pro Max і на SE: кнопки однієї висоти, поля однієї ширини","source":"Canvas-Card-Width.md, Edge-Margin-Rule.md, Device-Sizes-Audit.md","html":"\u003ch3\u003eДва типи екранів\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eПолотняні\u003c/b\u003e (\u003ccode\u003eMKSheetCanvas\u003c/code\u003e, \u003ccode\u003eMKGameCanvas\u003c/code\u003e через \u003ccode\u003eMKCanvas\u003c/code\u003e) малюють макет \u003cb\u003e393\u003c/b\u003e і масштабують його під апарат: \u003ccode\u003ecanvasScale = ширина / 393\u003c/code\u003e (17 Pro Max: 1.12, SE: 0.95). Елементи стоять через \u003ccode\u003emkPlace(x:y:width:height:)\u003c/code\u003e у координатах Figma.\u003c/li\u003e\u003cli\u003e\u003cb\u003eПотокові\u003c/b\u003e (\u003ccode\u003eMKSheetScreen\u003c/code\u003e) верстають у реальних пунктах: ширина \u003ccode\u003eMKLayout.fluid\u003c/code\u003e, поле \u003ccode\u003eMKLayout.edge\u003c/code\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eПравила\u003c/h3\u003e\u003cul\u003e\u003cli\u003eКоординати \u003ccode\u003emkPlace\u003c/code\u003e: макетні; \u003ccode\u003eMKLayout.side\u003c/code\u003e (24) і \u003ccode\u003econtent\u003c/code\u003e (344): для тексту й шапки на полотні, не чіпати. Картки й поля на полотні: на \u003ccode\u003ecardSide\u003c/code\u003e / \u003ccode\u003ecardContent\u003c/code\u003e (20 / 353), що дає те саме поле 20, що й у потоці.\u003c/li\u003e\u003cli\u003e\u003cb\u003eКнопки\u003c/b\u003e на полотні ділять висоту на \u003ccode\u003emkCanvasScale\u003c/code\u003e всередині \u003ccode\u003eMKButtonStyle\u003c/code\u003e: на екрані рівно \u003ccode\u003eMKSize.control\u003c/code\u003e, як потокові. \u003ccode\u003e@Environment(\\.mkCanvasScale)\u003c/code\u003e на самому екрані-власнику дає 1: значення видно лише вʼюхам усередині \u003ccode\u003eMKCanvas\u003c/code\u003e.\u003c/li\u003e\u003cli\u003e\u003cb\u003eРядки-поля\u003c/b\u003e на полотні (\u003ccode\u003eMKInputField\u003c/code\u003e через \u003ccode\u003emkPlace\u003c/code\u003e) масштабуються: на Pro Max 56 стає ≈63. Якщо потрібна рівність із потоковим полем: \u003ccode\u003eheight: MKSize.field / canvasScale\u003c/code\u003e або переводити екран на потік.\u003c/li\u003e\u003cli\u003eУсе, що тримається \u003cb\u003eкраю екрана\u003c/b\u003e (нижні кнопки),: поза полотном, у \u003ccode\u003ebottom:\u003c/code\u003e каркаса.\u003c/li\u003e\u003cli\u003eНовий екран: \u003cb\u003eпотоковий\u003c/b\u003e, якщо немає причини на попіксельну звірку з Figma.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eАпарати\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eMKDevice.width\u003c/code\u003e читається ліниво під час верстки (у \u003ccode\u003eApp.init\u003c/code\u003e сцени ще немає). Великі апарати: \u003ccode\u003eMKDevice.isLarge\u003c/code\u003e (ширина ≥ 428).\u003c/p\u003e","tags":""},{"slug":"exit-not-back","title":"Вихід: це не «назад»","summary":"Стрілка «назад» означає крок назад по стеку. Якщо дія виводить із кімнати чи партії: це значок виходу й підтвердження.","check":"на екранах кімнати й гри в шапці немає шеврона: лише значок виходу","source":"Crown-And-Win-Condition-2026-09-12.md, Room-Guest-States-2026-09-09.md (12.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eШеврон \u003ccode\u003e‹\u003c/code\u003e обіцяє повернення на попередній екран. Там, де тап насправді \u003cb\u003eвиводить із кімнати або вбиває партію\u003c/b\u003e, шеврона бути не може: ставимо значок виходу (\u003ccode\u003erectangle.portrait.and.arrow.right\u003c/code\u003e) і питаємо підтвердження.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eДе\u003c/th\u003e\u003cth\u003eЩо в шапці\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eЕкрани збірки партії (спосіб гри, режим, сети, налаштування)\u003c/td\u003e\u003ctd\u003eшеврон «назад»: він справді крок назад\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eЕкрани кімнати й активної партії (Get Ready, рейтинг, картка ролі, раунд, склад команд у гостя)\u003c/td\u003e\u003ctd\u003e\u003cb\u003eзначок виходу + діалог\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eГеймплей (\u003ccode\u003eMKActiveTeamBar\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003e\u003cb\u003eзначок виходу\u003c/b\u003e ліворуч від назви команди\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eЛобі організатора\u003c/td\u003e\u003ctd\u003e\u003cb\u003eзначок виходу\u003c/b\u003e (закриває кімнату, теж із діалогом)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eНосії: \u003ccode\u003eMKRuleHeader(onBack:onExit:)\u003c/code\u003e, \u003ccode\u003eMKSheetScreen(onBack:onExit:)\u003c/code\u003e, \u003ccode\u003eMKActiveTeamBar(onExit:)\u003c/code\u003e. Передаємо \u003cb\u003eщось одне\u003c/b\u003e: або \u003ccode\u003eonBack\u003c/code\u003e, або \u003ccode\u003eonExit\u003c/code\u003e.\u003c/p\u003e\u003ch3\u003eЧому\u003c/h3\u003e\u003cp\u003eВласниця: «кнопка НАЗАД значить же не вернуться на экран назад а конкретно покинуть комнату». У \u003ccode\u003eMKActiveTeamBar\u003c/code\u003e це було особливо помітно: гліф малював шеврон, а accessibility вже казав «Вийти з гри». У лобі організатора шеврон взагалі закривав кімнату для всіх.\u003c/p\u003e\u003cp\u003eДруга причина: стек. Ігровий цикл кімнати крутиться \u003cb\u003eзамінами\u003c/b\u003e верхнього екрана, тож під ним лежать не пройдені кроки, а екрани збірки партії: «назад» провалювався в налаштування вже початої гри.\u003c/p\u003e\u003ch3\u003eПастки\u003c/h3\u003e\u003cul\u003e\u003cli\u003eПрибравши шеврон, перевір, що екран не лишився \u003cb\u003eбез виходу взагалі\u003c/b\u003e.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e  Саме так сталося, коли з Get Ready і рейтингу прибрали другорядні кнопки   («Нова гра», «Завершити гру»): вихід довелось повернути значком у шапці.\u003c/p\u003e\u003cul\u003e\u003cli\u003eПоза кімнатою партію з Get Ready більше не кидають: виходять на головну\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e  й тиснуть «Створити гру», яка питає підтвердження.\u003c/p\u003e\u003cul\u003e\u003cli\u003eUI-тести шукають кнопку за підписом: після заміни це \u003cb\u003e«Вийти»\u003c/b\u003e, а не «Назад».\u003c/li\u003e\u003c/ul\u003e","tags":""},{"slug":"canvas-widths","title":"Ширини всередині полотна: з макета","summary":"У MKCanvas/MKScrollCanvas ширини беруться з макета (MKLayout.content). MKLayout.fluid: тільки на потокових екранах.","check":"на 17 Pro Max тло доходить до країв, підвал пейволу має поля","source":"Large-Device-Layout-2026-09-14.md (14.09)","html":"\u003ch3\u003eПравило\u003c/h3\u003e\u003cp\u003eПолотно живе в координатах макета 393×852 і \u003cb\u003eмасштабується цілком\u003c/b\u003e під ширину апарата. Тому всередині нього будь-яка ширина: теж із макета:\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eДе\u003c/th\u003e\u003cth\u003eЩо брати\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eУсередині \u003ccode\u003eMKCanvas\u003c/code\u003e / \u003ccode\u003eMKScrollCanvas\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003e\u003ccode\u003eMKLayout.content\u003c/code\u003e\u003c/b\u003e (344): полотно домасштабує саме\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eПотокові екрани (\u003ccode\u003eMKSheetScreen\u003c/code\u003e, \u003ccode\u003eMKGameScreen\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003e\u003cb\u003e\u003ccode\u003eMKLayout.fluid\u003c/code\u003e\u003c/b\u003e: рахується від екрана\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003ccode\u003eMKLayout.fluid = max(MKDevice.width - 40, 280)\u003c/code\u003e. На 17 Pro Max це \u003cb\u003e400\u003c/b\u003e. Поставлене всередині полотна, воно множиться на масштаб 440/393 = 1.12 і дає \u003cb\u003e448 pt на 440-пунктовому екрані\u003c/b\u003e: елемент вилазить за обидва краї.\u003c/p\u003e\u003ch3\u003eДруге правило: полотно не прибивають до 393\u003c/h3\u003e\u003cp\u003eЕкран не робить свій \u003ccode\u003eScrollView\u003c/code\u003e із \u003ccode\u003e.frame(width: MKCanvasSize.width)\u003c/code\u003e і \u003ccode\u003e.clipped()\u003c/code\u003e. Так було на рейтингу: і на будь-якому апараті, ширшому за макет, полотно лишалось 393 по центру, а з боків світили смуги голого \u003ccode\u003ebgScreen\u003c/code\u003e (заміряно 23.5 pt з кожного боку). Потрібен скрол зі змінною висотою: це \u003ccode\u003eMKScrollCanvas(contentHeight:)\u003c/code\u003e.\u003c/p\u003e\u003ch3\u003eЯк перевіряти\u003c/h3\u003e\u003cp\u003eЗняти екрани на 17 Pro Max (\u003ccode\u003e.sim-device\u003c/code\u003e → \u003ccode\u003eiPhone 17 Pro Max\u003c/code\u003e, далі \u003ccode\u003esim.sh\u003c/code\u003e) і шукати \u003cb\u003eшов рівно на межі макета\u003c/b\u003e: на 440-пунктовому апараті це \u003ccode\u003ex = (440 - 393) / 2 = 23.5 pt\u003c/code\u003e, тобто 70 px у знімку 1320 px. Ознака дефекту: край рівно кольору \u003ccode\u003ebgScreen\u003c/code\u003e, а одразу за межею інший колір. Після перевірки \u003ccode\u003e.sim-device\u003c/code\u003e повернути.\u003c/p\u003e\u003ch3\u003eПастки\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eНе плутати з нормальним краєм листа.\u003c/b\u003e Білий лист на потокових екранах\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e  законно доходить до країв: це не шов.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003e\u003ccode\u003emaxWidth: fluid\u003c/code\u003e у полотні\u003c/b\u003e не так страшно, як \u003ccode\u003ewidth: fluid\u003c/code\u003e: це стеля,\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e  а не примус. Але краще теж із макета.\u003c/p\u003e\u003cul\u003e\u003cli\u003eРецепт «дати бічне поле через \u003ccode\u003efluid\u003c/code\u003e» для полотняного екрана **не\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e  лікує, а спричиняє** проблему: саме так підвал пейволу і зламався.\u003c/p\u003e","tags":""},{"slug":"dark-surfaces","title":"Темне: два тла, одна поверхня, скло рідко","summary":"Темний екран має одне з двох тел. Плашка на темному: mkOnDarkSurface. Скло: лише поверх фото й на лічильниках карток. Блюр: лише пауза на весь екран.","check":"grep \"game-bg\\|hazePink\\|ultraThinMaterial\" у Features: лише дозволені місця","source":"On-Dark-Surface-Rule-2026-09-21.md, Unified-Dark-Background-2026-09-22.md","html":"\u003ch3\u003eДва тла\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eТло\u003c/th\u003e\u003cth\u003eКомпонент\u003c/th\u003e\u003cth\u003eДе\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eТемно-синій + блакитна пляма\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKScreenBackdrop\u003c/code\u003e (сам у \u003ccode\u003eMKDarkScreen\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003eголовна, перемога, рейтинг, «Приготуватись до гри», лобі, ролі, сканер\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eІгровий рендер, притемнений\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKGameBackdrop\u003c/code\u003e (\u003ccode\u003egame-bg\u003c/code\u003e + вуаль \u003ccode\u003ebgScreen\u003c/code\u003e @ soft)\u003c/td\u003e\u003ctd\u003eгра, кімната під час раунду, флешкартки словника\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eЕкрани з білим листом (\u003ccode\u003eMKSheetScreen\u003c/code\u003e, \u003ccode\u003eMKSheetCanvas\u003c/code\u003e): темна шапка + пляма \u003ccode\u003ehaze\u003c/code\u003e під листом. Рожевих плям на тлі немає (22.09). Пляма: завжди оверлеєм тла: \u003ccode\u003eMKBlob\u003c/code\u003e 482 pt ширший за екран і, бувши дитиною \u003ccode\u003eZStack\u003c/code\u003e, розширює лист і ховає його кути.\u003c/p\u003e\u003ch3\u003eПоверхня на темному\u003c/h3\u003e\u003cp\u003eБудь-яка плашка, пігулка, рядок на темному тлі: \u003ccode\u003e.mkOnDarkSurface(shape)\u003c/code\u003e: білий 12 % + кант 10 %. Своїх заливок \u003ccode\u003ewhite.opacity(…)\u003c/code\u003e не заводимо.\u003c/p\u003e\u003ch3\u003eСкло і блюр\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eРідке скло\u003c/b\u003e (\u003ccode\u003eglassEffect\u003c/code\u003e, iOS 26): лише поверх фото (обкладинки сетів, \u003ccode\u003eMKPillSurface\u003c/code\u003e) і на лічильниках сесії карток (\u003ccode\u003eMKSessionCounter\u003c/code\u003e). На рівному темному тлі скло не читається.\u003c/li\u003e\u003cli\u003e\u003cb\u003eБлюр\u003c/b\u003e (\u003ccode\u003eultraThinMaterial\u003c/code\u003e): лише вуаль паузи на весь екран (гра, «організатор зник»).\u003c/li\u003e\u003c/ul\u003e","tags":""},{"slug":"copy","title":"Тексти: без довгих тире, одне визначення","summary":"У текстах UI і контенті немає «,» і «…». Визначення слова всюди одне; для «Слова дня»: окреме коротке; приклад: лише на звороті флешкартки.","check":"grep \": \" у рядках Text/тостів і в wordsets.json: має бути порожньо","source":"Word-Of-Day-Definition-2026-09-22.md, аудит 21.09","html":"\u003ch3\u003eТире\u003c/h3\u003e\u003cp\u003eДовгих тире в інтерфейсі й контенті немає (рішення 21.09): двокрапка, кома або нове речення. «Ліміт узято, коло дограють», «Головне правило гри: пояснити…», «Почуєш заборонене? Знімай слово». Порожнє значення у коді («,» як заглушка): не текст UI.\u003c/p\u003e\u003ch3\u003eЯке пояснення де\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eПоле\u003c/th\u003e\u003cth\u003eДе\u003c/th\u003e\u003cth\u003eДовжина\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edefinition\u003c/code\u003e (перше речення \u003ccode\u003edetails\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003eсловник, підсумок раунду, зіграні слова, історія, зворот флешкартки\u003c/td\u003e\u003ctd\u003eдо ~140\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edayDefinition\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eлише картка «Слово дня»\u003c/td\u003e\u003ctd\u003e45…85, одне речення\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eexample\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eлише зворот флешкартки, блок «ПРИКЛАД»\u003c/td\u003e\u003ctd\u003e,\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eexplanation\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eзапасний, якщо немає \u003ccode\u003edetails\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eкоротке\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eСірих дрібних «контекстних» речень під визначенням немає (21.09).\u003c/p\u003e\u003ch3\u003eМітки\u003c/h3\u003e\u003cul\u003e\u003cli\u003eСет-джерело слова: \u003ccode\u003eMKSetChip\u003c/code\u003e (синій капс) згори картки; мітки «СЛОВО» немає.\u003c/li\u003e\u003cli\u003eМножина: \u003ccode\u003eMKPlural.pick(n, &quot;слово&quot;, &quot;слова&quot;, &quot;слів&quot;)\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eПідказки під CTA: над кнопкою, не під нею; дублюючих підписів («СЛОВО БАЧИТЬ ЛИШЕ…») не додаємо.\u003c/li\u003e\u003c/ul\u003e","tags":""},{"slug":"screen-layout","title":"Каркас екрана: CTA внизу, картка гри одна","summary":"Головна кнопка завжди на тому самому місці (низ 786 на полотні 852). Ігрові картки: 256×373 з боковими притемненими; флешкартка: 301×464. Шапка: на одній висоті з іншими екранами.","check":"знімки роутів gameSettings, roomGuessingHard, savedWordCards: низ кнопки на однаковій висоті","source":"аудит 21…22.09","html":"\u003ch3\u003eCTA\u003c/h3\u003e\u003cul\u003e\u003cli\u003eНиз головної кнопки = 852 − 34 (дім-індикатор) − 32 (\u003ccode\u003exl\u003c/code\u003e) = \u003cb\u003e786\u003c/b\u003e на полотні; на листах: \u003ccode\u003eMKSheetScreen.bottom\u003c/code\u003e з \u003ccode\u003epadding(.bottom, xl)\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eПідказка до кнопки: над нею (\u003ccode\u003esm\u003c/code\u003e), кнопка лишається на місці CTA.\u003c/li\u003e\u003cli\u003eУ кімнаті всі ролі тримають нижній слот на тому ж місці (кнопка «Зняти слово», плашки «Вигукуй варіанти», «Зараз грає…»).\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eКартки гри й навчання\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eЕкран\u003c/th\u003e\u003cth\u003eКартка\u003c/th\u003e\u003cth\u003eБокові\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eГра, кімната\u003c/td\u003e\u003ctd\u003e256×373 (\u003ccode\u003eMKWordCardGame\u003c/code\u003e, \u003ccode\u003eMKStateCard\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003eпритемнені 50 % з рамкою, ті самі розміри\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eФлешкартки словника\u003c/td\u003e\u003ctd\u003e301×464, зазор 12\u003c/td\u003e\u003ctd\u003eті самі, притемнені 50 %\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eСлово дня\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eMKCardFan\u003c/code\u003e, ширина від висоти екрана\u003c/td\u003e\u003ctd\u003eвіяло 2 картки\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eНад флешкарткою «↑ Вивчено N», під нею «↓ Вчу N» (\u003ccode\u003eMKSessionCounter\u003c/code\u003e). Під час міні-онбордингу на їхніх місцях: підказки жестів.\u003c/p\u003e\u003ch3\u003eШапка\u003c/h3\u003e\u003cp\u003eЗаголовок на темному: на одній висоті на всіх екранах: \u003ccode\u003eMKLayout.sheetHeaderTop\u003c/code\u003e (листи), \u003ccode\u003eheaderTop\u003c/code\u003e (темні полотна). Головна: \u003ccode\u003epadding(.top, lg)\u003c/code\u003e від безпечної зони.\u003c/p\u003e","tags":""},{"slug":"components-map","title":"Карта компонентів: що, де, коли","summary":"Кожен елемент інтерфейсу: компонент ДС у DesignSystem/Components або App/MKAppScaffold. Таблиця каже, де він живе і коли його брати. Нового не заводимо, поки тут є схоже.","check":"grep \"^struct MK\" у Features: має бути порожньо (22.09 перенесено 33 компоненти)","source":"аудит ДС 22.09","html":"\u003ch3\u003eКаркаси екранів\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eКомпонент\u003c/th\u003e\u003cth\u003eКоли\u003c/th\u003e\u003cth\u003eДе\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKSheetScreen\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eекран із білим листом і прибитими кнопками\u003c/td\u003e\u003ctd\u003eналаштування, спосіб гри, словник, режим гри\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKSheetCanvas\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eте саме, але попіксельно за макетом (полотно 393×852)\u003c/td\u003e\u003ctd\u003eправила, команди, режим\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKGameScreen\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eтемний екран без листа з кнопками внизу\u003c/td\u003e\u003ctd\u003eлобі, ролі, сканер\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKDarkScreen\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eтемний екран із власною версткою\u003c/td\u003e\u003ctd\u003eголовна\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKCanvas\u003c/code\u003e / \u003ccode\u003eMKScrollCanvas\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eполотно з абсолютними координатами / зі скролом\u003c/td\u003e\u003ctd\u003eгра, перемога, рейтинг\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKScreenBackdrop\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eтло всіх темних екранів\u003c/td\u003e\u003ctd\u003eдив. правило «Темне»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKGameBackdrop\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eтло гри, кімнати під час раунду, флешкарток\u003c/td\u003e\u003ctd\u003e,\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKPinnedButtons\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eкнопки, прибиті до низу з мʼяким переходом\u003c/td\u003e\u003ctd\u003eGet Ready, рейтинг, перемога\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKRuleHeader\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eшапка: назва + назад / вихід / дія\u003c/td\u003e\u003ctd\u003eусі екрани\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eКнопки й контроли\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eКомпонент\u003c/th\u003e\u003cth\u003eКоли\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.mkPrimary\u003c/code\u003e / \u003ccode\u003e.mk(.secondary)\u003c/code\u003e / \u003ccode\u003e.mkTertiary\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eголовна дія / друга / текстова. Одна primary на екран\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKChip\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eмітка сету (\u003ccode\u003eaccent\u003c/code\u003e), «Зберегти» (\u003ccode\u003eaccentOutline\u003c/code\u003e → \u003ccode\u003eaccentSolid\u003c/code\u003e), бал (\u003ccode\u003eking\u003c/code\u003e / \u003ccode\u003eneutralOutline\u003c/code\u003e), фільтр (\u003ccode\u003einverse\u003c/code\u003e / \u003ccode\u003eplain\u003c/code\u003e), на темному (\u003ccode\u003eonDark\u003c/code\u003e)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eMKFilterChip\u003c/code\u003e\u003c/td\u003e /* ── Swift-підсвітка (мінімальна) ───────────────────────────────── */
function hl(code) {
 let s = esc(code);
 s = s.replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>');
 s = s.replace(/(&quot;[^&\n]*?&quot;)/g, '<span class="str">$1</span>');
 s = s.replace(/\b(let|var|func|struct|enum|case|if|else|return|some|View|Button|Text|true|false|nil|@State|@Binding)\b/g, '<span class="kw">$1</span>');
 s = s.replace(/\b(MK[A-Za-z]+|mk[A-Z][A-Za-z]*)\b/g, '<span class="tok">$1</span>');
 return s;
}
function codeBox(code) {
 return `<div class="codebox"><pre>${hl(code.trim())}</pre><button class="cp" data-copy="${esc(code.trim())}">Копіювати</button></div>`;
}
function copy(text) {
 const done = () => { const t = $('#toast'); t.textContent = 'Скопійовано'; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1400); };
 try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } catch (e) { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
 const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
 try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
}
document.addEventListener('click', e => {
 const b = e.target.closest('[data-copy]'); if (b) { e.preventDefault(); copy(b.dataset.copy); }
});

}

/* ── Компонент на сцені ─────────────────────────────────────────── */
const STATE = {};
function ctrlHTML(c, p, cid) {
 const id = `${cid}-${c.k}`;
 if (c.type === 'bool') return `<label class="sw ctrl" for="${id}"><span>${c.label}</span><input type="checkbox" id="${id}" data-k="${c.k}" ${p[c.k] ? 'checked' : ''}></label>`;
 if (c.type === 'text') return `<div class="ctrl"><label for="${id}">${c.label}</label><input type="text" id="${id}" data-k="${c.k}" value="${esc(p[c.k])}"></div>`;
 if (c.type === 'range') return `<div class="ctrl"><label for="${id}">${c.label}<span class="rv">${p[c.k]}${c.unit || ''}</span></label><input type="range" id="${id}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step || 1}" value="${p[c.k]}"></div>`;
 return `<div class="ctrl"><span class="lbl">${c.label}</span><div class="segc" role="group" aria-label="${esc(c.label)}">${c.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button data-k="${c.k}" data-v="${esc(JSON.stringify(v))}" class="${JSON.stringify(p[c.k]) === JSON.stringify(v) ? 'on' : ''}">${l}</button>`; }).join('')}</div></div>`;
}
function usedLine(def) {
 const u = (DATA.usage[def.swift?.split(/[ .(]/)[0]] || []);
 return u.length ? `${u.length} ${u.length === 1 ? 'екран' : (u.length < 5 ? 'екрани' : 'екранів')}` : '';
}
function compHTML(def) {
 const p = STATE[def.id];
 const dev = def.dev || {};
 const u = DATA.usage[def.swift?.split(/[ .(]/)[0]] || [];
 const bg = typeof def.bg === 'function' ? def.bg(p) : (def.bg || 'sheet');
 return `<section class="block comp" id="${def.id}" data-q="${esc((def.title + ' ' + (def.swift || '') + ' ' + (def.what || '') + ' ' + (def.tags || '')).toLowerCase())}">
 ${blockHead(def.id, def.title, def.swift, usedLine(def))}
 ${def.what ? `<p class="what">${def.what}</p>` : ''}
 <div class="play" style="${(def.controls || []).length ? '' : 'grid-template-columns:1fr'}">
  <div class="stage" data-bg="${bg}"><div class="dev${def.center === false ? '' : ' center'}" data-stage="${def.id}"></div></div>
  <div class="ctrls" data-ctrls="${def.id}">${(def.controls || []).map(c => ctrlHTML(c, p, def.id)).join('')}${def.hint ? `<p class="hint">${def.hint}</p>` : ''}</div>
 </div>
 ${def.states && def.states.length ? `<div class="states" data-states="${def.id}"></div>` : ''}
 <details class="devspec"><summary>${CHEV}Для розробника<span class="sm">${esc(def.file || '')}</span></summary><div class="spec">
  ${dev.code ? `<div><h5>Як викликати</h5>${codeBox(dev.code)}</div>` : ''}
  ${dev.params && dev.params.length ? `<div><h5>Параметри</h5><ul>${dev.params.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
  ${dev.rules && dev.rules.length ? `<div><h5>Важливо</h5><ul>${dev.rules.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
  ${u.length ? `<div><h5>Де використано</h5><div class="files">${u.map(f => `<span>${esc(f)}</span>`).join('')}</div></div>` : ''}
 </div></details>
 </section>`;
}
function ctxFor(def) {
 return {
  id: def.id,
  set(k, v) { STATE[def.id][k] = v; renderStage(def); syncCtrls(def); },
  get(k) { return STATE[def.id][k]; },
  icon, AV, esc
 };
}
function renderStage(def) {
 const el = document.querySelector(`[data-stage="${def.id}"]`); if (!el) return;
 const p = STATE[def.id], ctx = ctxFor(def);
 el.innerHTML = def.render(p, ctx);
 const stage = el.parentElement;
 if (typeof def.bg === 'function') stage.dataset.bg = def.bg(p);
 def.mount && def.mount(el, p, ctx);
}
function syncCtrls(def) {
 const box = document.querySelector(`[data-ctrls="${def.id}"]`); if (!box) return;
 const p = STATE[def.id];
 box.querySelectorAll('[data-k]').forEach(n => {
  const k = n.dataset.k;
  if (n.type === 'checkbox') n.checked = !!p[k];
  else if (n.type === 'range') { n.value = p[k]; const rv = n.parentElement.querySelector('.rv'); if (rv) rv.textContent = p[k] + ((def.controls.find(c => c.k === k) || {}).unit || ''); }
  else if (n.type === 'text') { if (document.activeElement !== n) n.value = p[k]; }
  else n.classList.toggle('on', n.dataset.v === JSON.stringify(p[k]));
 });
}
function wireCtrls(def) {
 const box = document.querySelector(`[data-ctrls="${def.id}"]`); if (!box) return;
 const ctx = ctxFor(def);
 box.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) ctx.set(b.dataset.k, JSON.parse(b.dataset.v)); });
 box.addEventListener('input', e => {
  const n = e.target; if (!n.dataset.k) return;
  if (n.type === 'checkbox') ctx.set(n.dataset.k, n.checked);
  else if (n.type === 'range') ctx.set(n.dataset.k, +n.value);
  else if (n.type === 'text') ctx.set(n.dataset.k, n.value);
 });
}
function renderStates(def) {
 const box = document.querySelector(`[data-states="${def.id}"]`); if (!box) return;
 const base = def.props || {};
 box.innerHTML = def.states.map((s, i) => {
  const p = Object.assign({}, base, s.p || {});
  const bg = s.bg || (typeof def.bg === 'function' ? def.bg(p) : def.bg) || 'sheet';
  return `<figure><div class="mini" data-bg="${bg}" style="${s.w ? `width:${s.w}px` : ''}"><div class="dev" data-mini="${def.id}-${i}" style="${s.w ? 'width:100%' : ''}">${def.render(p, { static: true, set() {}, get: k => p[k], icon, AV, esc })}</div></div><figcaption>${s.label}</figcaption></figure>`;
 }).join('');
}
const MOUNTED = new Set();
function mountComp(def) {
 if (MOUNTED.has(def.id)) return; MOUNTED.add(def.id);
 renderStage(def); wireCtrls(def); if (def.states) renderStates(def);
}

function build() {
 DS.comps.forEach(d => { STATE[d.id] = Object.assign({}, d.props || {}); });
 const byG = {}; DS.comps.forEach(d => (byG[d.group] = byG[d.group] || []).push(d));
 let side = `<div class="sec" data-sec="found"><button>${CHEV}Основи<span class="n">${FOUND.length}</span></button><ul>` +
  FOUND.map(([id, t]) => `<li><a href="#${id}" data-go="${id}">${t}</a></li>`).join('') + `</ul></div>`;
 let main = secHead('found', 'Основи', 'токени, з яких зібрано все') + FOUND.map(([id]) => F[id]()).join('');
 GROUPS.forEach(([g, title, doc]) => {
  const list = byG[g]; if (!list || !list.length) return;
  side += `<div class="sec" data-sec="${g}"><button>${CHEV}${title}<span class="n">${list.length}</span></button><ul>` +
   list.map(d => `<li><a href="#${d.id}" data-go="${d.id}">${d.title}</a></li>`).join('') + `</ul></div>`;
  main += `<div class="grpwrap" data-g="${g}">${secHead('g-' + g, title, list.length + ' ' + (list.length === 1 ? 'компонент' : list.length < 5 ? 'компоненти' : 'компонентів'))}<p class="lead">${doc}</p>` + list.map(compHTML).join('') + `</div>`;
 });
 side += `<div class="sec" data-sec="rules"><button>${CHEV}Правила<span class="n">${DATA.rules.length}</span></button><ul><li><a href="#rules" data-go="rules">Усі правила ДС</a></li></ul></div>`;
 main += secHead('g-rules', 'Правила') + F.rules();
 $('#side').innerHTML = side; $('#main').innerHTML = main;
 const n = DS.comps.length, n10 = n % 10, n100 = n % 100; $('#meta').textContent = `дизайн-система · ${n} ${n10 === 1 && n100 !== 11 ? 'секція' : n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14) ? 'секції' : 'секцій'}`;
 document.querySelectorAll('.sec>button').forEach(b => b.onclick = () => b.parentElement.classList.toggle('closed'));
 document.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); document.body.classList.remove('menu'); go(a.dataset.go); });
 // ліниве монтування сцен
 const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const d = DS.comps.find(c => c.id === e.target.id); d && mountComp(d); } }), { rootMargin: '600px 0px' });
 document.querySelectorAll('.comp').forEach(s => io.observe(s));
 const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) mark(e.target.id); }), { rootMargin: '-40% 0px -55% 0px' });
 document.querySelectorAll('.block').forEach(s => spy.observe(s));
 const ts = $('#typeSample'); ts && ts.addEventListener('input', () => document.querySelectorAll('[data-sample]').forEach(n => n.textContent = ts.value || ' '));
}
function mark(id) { document.querySelectorAll('.side a').forEach(a => { const on = a.dataset.go === id; a.classList.toggle('on', on); if (on) a.closest('.sec').classList.remove('closed'); }); }
function go(id) {
 const el = document.getElementById(id); if (!el) return;
 const d = DS.comps.find(c => c.id === id); d && mountComp(d);
 el.scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + id); mark(id);
}
function filter() {
 const q = $('#q').value.trim().toLowerCase();
 document.querySelectorAll('.block').forEach(b => { b.hidden = !!q && !(b.dataset.q || '').includes(q); });
 document.querySelectorAll('.grpwrap').forEach(g => { const any = [...g.querySelectorAll('.block')].some(b => !b.hidden); g.hidden = !!q && !any; });
 document.querySelectorAll('.sechead').forEach(h => { if (h.id === 'found') h.hidden = !!q && ![...document.querySelectorAll('#found ~ .block')].some(b => !b.hidden); });
 document.querySelectorAll('.side li').forEach(li => { const a = li.querySelector('a'); const b = document.getElementById(a.dataset.go); li.hidden = !!(b && b.hidden); });
 document.querySelectorAll('.side .sec').forEach(s => { s.hidden = ![...s.querySelectorAll('li')].some(l => !l.hidden); });
 if (q) document.querySelectorAll('.comp:not([hidden])').forEach(s => { const d = DS.comps.find(c => c.id === s.id); d && mountComp(d); });
}
DS.boot = function () {
 const st = document.createElement('style'); st.textContent = DS.css.join('\n'); document.head.appendChild(st);

 $('#q').addEventListener('input', filter);
 document.addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input,textarea')) { e.preventDefault(); $('#q').focus(); } });

};

 what: 'Єдиний слайдер застосунку: значення живе в самій ручці. Тягни ручку на сцені, значення стрибає по кроках, або клікай шеврони в ручці. Синя заливка доходить до правого краю ручки.',

   b.addEventListener('click', e => { e.stopPropagation(); if (justDragged) return; const i = p.idx + +b.dataset.st; if (i < 0 || i > n - 1) return; setIdx(i); place(idxProg(i)); setTimeout(commit, 320); });

const LOCAL = {
 'crown': '<path d="M3 8.2l4.6 4 4.4-6.7 4.4 6.7 4.6-4-1.8 10.3H4.8z" class="s"/>',
};
function ic(name, size, color = 'currentColor', w = 2) {
 if (LOCAL[name]) return `<svg class="mk-ic" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" style="color:${color};--sw:${w}">${LOCAL[name]}</svg>`;

/* ── MKChip ─────────────────────────────────────────── */
function chipLabel(text, symbol, size, cls = '') {
 const g = size === 's' ? 15 : 20;
 return `<span class="${cls}">${symbol ? `<span class="sym" style="display:flex">${ic(symbol, g, 'currentColor', 2.2)}</span>` : ''}<span>${esc(text)}</span></span>`;
}
function chip(o) {
 const size = o.size || 'm', tone = o.tone || 'accent';
 const keepers = (o.keepers || []).map(k => chipLabel(o.upper ? k.toUpperCase() : k, o.symbol, size, 'keep')).join('');
 return `<span class="mk-chip ${size} ${tone} ${o.upper ? 'up' : ''} ${o.nostroke ? 'nostroke' : ''} ${o.tap ? 'tap' : ''}" ${o.tap ? 'role="button" tabindex="0" data-chip' : ''}><span class="stk">${keepers}${chipLabel(o.text, o.symbol, size)}</span></span>`;
}

function presetChip(key, on, title, ctx) {
 const pr = CHIP_PRESETS[key], v = (on || !pr.off) ? pr.on : pr.off;

/* SwiftUI .lineLimit(n).minimumScaleFactor(k): стискати, поки текст не влізе в n рядків і ширину */
function fitLines(n, lines, minScale) {
 if (!n) return;
 n.style.fontSize = ''; n.style.display = 'block';
 const full = parseFloat(getComputedStyle(n).fontSize); let s = full;
 const over = () => n.scrollWidth > n.clientWidth + 1 || n.getBoundingClientRect().height > lines * s * 1.26 + 1;
 while (over() && s > full * minScale) { s -= 0.5; n.style.fontSize = s + 'px'; }
 if (over()) { n.style.display = '-webkit-box'; n.style.webkitLineClamp = lines; n.style.webkitBoxOrient = 'vertical'; n.style.overflow = 'hidden'; }
}
